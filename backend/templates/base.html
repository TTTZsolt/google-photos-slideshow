<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Lumina{% endblock %}</title>
    
    <!-- Design & Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Lumina Design System -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/lumina.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#f5f8ff] min-h-screen">

    <div class="container mx-auto px-4 pt-0 pb-6 max-w-5xl">
        <!-- Unified Header -->
        <header class="mb-10 w-full pt-8">
            <div class="w-full max-w-2xl mx-auto px-6 flex items-start justify-between">
                <a href="/" class="flex flex-col items-start group no-underline" title="Vissza a főoldalra">
                    <span class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600 tracking-tighter drop-shadow-sm select-none leading-none group-hover:from-indigo-600 group-hover:to-purple-700 transition-all">Lumina</span>
                    <p class="text-slate-500 font-medium tracking-tight relative -top-1 group-hover:text-indigo-500 transition-colors">Képtár +</p>
                </a>
                
                <div class="flex items-start gap-4 mt-2">
                    {% block back_button %}
                    <!-- FINAL HOME BUTTON STYLE -->
                    <div class="flex flex-col items-center gap-1">
                        <a href="/" class="p-2 rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all shadow-sm border border-indigo-100" title="Vissza a főoldalra">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </a>
                        <span class="text-[8px] font-black text-indigo-500 opacity-40 uppercase tracking-tighter">V{{ version }}</span>
                    </div>
                    {% endblock %}
                </div>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
    
    {% block extra_scripts %}{% endblock %}

    <!-- Subtle Version Watermark -->
    <div class="fixed bottom-4 right-4 pointer-events-none select-none opacity-20 hover:opacity-50 transition-opacity z-[10002]">
        <span class="text-[9px] font-black tracking-widest text-slate-400 uppercase">Lumina v{{ version }}</span>
    </div>
</body>
</html>
