<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina - Szortírozó V14.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f5f8ff;
            color: #0f172a;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
        }

        .deck-container {
            position: relative;
            width: 95vw;
            height: 72vh;
            max-width: 500px;
            margin-top: 5px;
        }

        .card {
            position: absolute;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            border: 2px solid rgba(255,255,255,0.05);
        }

        /* MAIN CARD */
        .card.current {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            opacity: 1;
            transform: scale(1);
        }

        /* THUMBNAIL (NEXT) CARD */
        .card.next {
            z-index: 100; /* Above the current card but small in corner */
            width: 110px;
            height: 150px;
            right: 0px;
            bottom: 30px;
            transform: scale(1);
            opacity: 1;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 3px solid var(--accent-blue);
            pointer-events: auto; /* Clickable for Undo */
        }
        
        .card.next .card-info { display: none; } /* Hide text for thumbnail */
        
        .delete-zone {
            position: absolute;
            left: 0px;
            bottom: 52px;
            width: 85px;
            height: 85px;
            z-index: 200; /* Ensure it's above cards */
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .delete-zone:active {
            background: rgba(239, 68, 68, 0.4);
            transform: scale(0.95);
            border-color: #ef4444;
        }
        
        .delete-zone span {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .card-image {
            flex: 1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            position: relative;
        }

        .error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            color: #ef4444;
            font-size: 10px;
            text-align: center;
            padding: 10px;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            z-index: 110;
            white-space: nowrap;
        }

        .overlay-right { color: var(--accent-green); border: 6px solid var(--accent-green); transform: translate(-50%, -50%) rotate(-15deg); }
        .overlay-left { color: var(--accent-blue); border: 6px solid var(--accent-blue); transform: translate(-50%, -50%) rotate(15deg); }
        .overlay-down { color: var(--accent-purple); border: 6px solid var(--accent-purple); }
        .overlay-up { color: var(--accent-red); border: 6px solid var(--accent-red); }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.15); }

        /* Fullscreen Mode Overrides */
        body.fullscreen-mode {
            padding: 0 !important;
            background: #000 !important;
            height: 100vh;
            width: 100vw;
        }

        body.fullscreen-mode header {
            display: none !important;
        }

        body.fullscreen-mode .deck-container {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            margin: 0 !important;
            border-radius: 0;
        }

        body.fullscreen-mode .card {
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        body.fullscreen-mode #controlsContainer {
            bottom: 20px !important;
            z-index: 10000;
        }

        body.fullscreen-mode #categoryGrid {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        body.fullscreen-mode .glass-btn span {
            display: none !important; /* No text in fullscreen */
        }
        
        body.fullscreen-mode .glass-btn {
            padding: 6px !important;
        }

        #exitFullscreenBtn {
            display: none;
        }

        body.fullscreen-mode #exitFullscreenBtn {
            display: flex;
            position: fixed;
            bottom: 24px;
            left: 20px;
            z-index: 10001;
        }
        
        body.fullscreen-mode .card.next {
            bottom: 100px !important; /* Move next preview up in fullscreen */
        }

        /* End of Fullscreen */

        /* Undo Warning */
        #undoOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        #undoOverlay.subtle {
            background: transparent;
            backdrop-filter: none;
            align-items: flex-start;
            padding-top: 80px;
            pointer-events: none;
        }

        #undoOverlay.subtle .warning-content {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 100px;
            transform: scale(0.9);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start py-2 sm:py-4 bg-[#f8fafc]">
    
    <!-- Undo Alert Overlay -->
    <div id="undoOverlay">
        <div class="warning-content flex flex-col items-center gap-3 p-8 rounded-3xl text-center max-w-[280px]">
            <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mb-1">
                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
            </div>
            <p class="text-white font-bold text-sm leading-tight">Visszavonás...<br><span class="text-[10px] font-medium text-slate-300">Az előző kép visszakerül a listába.</span></p>
        </div>
    </div>
    <!-- Header Wrapper - Single Compact Row -->
    <header class="w-full max-w-2xl px-4 flex items-center justify-between mb-2">
        <!-- Left: Home -->
        <a href="/" class="p-2 rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all">
            <i data-lucide="home" class="w-5 h-5"></i>
        </a>

        <!-- Center: Status Info -->
        <div class="flex items-center gap-3">
            <h1 class="text-sm font-bold tracking-tight text-slate-800">
                Szortírozó <span class="text-[9px] text-indigo-400 font-black">V14.2</span>
            </h1>
            <div class="h-3 w-[1px] bg-slate-200"></div>
            <p class="text-[9px] text-slate-500 font-black uppercase tracking-widest" id="remainingCount">SCANNING...</p>
        </div>

        <!-- Right Tools: Fullscreen & Refresh -->
        <div class="flex items-center gap-1">
            <button onclick="toggleFullscreen(true)" class="p-2 text-slate-400 hover:text-indigo-600 transition-all">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
            <button onclick="location.reload()" class="p-2 text-slate-400 hover:text-indigo-600 transition-all">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <div class="deck-container" id="deck">
        <!-- Cards injected by JS -->
        <div class="flex flex-col items-center justify-start pt-20 h-full text-center p-6" id="emptyMessage">
            <!-- Loading State -->
            <div id="loadingState" class="flex flex-col items-center space-y-4">
                <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
                <p class="text-slate-500 italic font-medium">Portyázás a képek után...</p>
            </div>
            
            <!-- Done State (Hidden by default) -->
            <div id="doneState" class="hidden flex flex-col items-center space-y-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 rounded-full flex items-center justify-center border border-indigo-500/30 shadow-2xl shadow-indigo-500/10 mb-2">
                    <i data-lucide="sparkles" class="w-10 h-10 text-indigo-400"></i>
                </div>
                <div>
                    <h2 id="statusTitle" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 mb-1">Minden kész!</h2>
                    <p id="statusText" class="text-slate-400 text-xs font-semibold uppercase tracking-wider max-w-[200px] mx-auto">Nincs több besorolandó kép.</p>
                </div>
                <a href="/" class="mt-2 px-6 py-2.5 bg-indigo-600/90 hover:bg-indigo-600 text-white text-xs font-black uppercase tracking-widest rounded-xl transition-all shadow-lg hover:shadow-indigo-500/25 active:scale-95 flex items-center gap-2">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i>
                    Vissza a főoldalra
                </a>
            </div>
        </div>
        
        <!-- Symmetrical Trash Zone (opposite of "next" card) -->
        <button id="deleteBtnZone" onclick="classify('delete')" class="delete-zone hidden">
            <i data-lucide="trash-2" class="w-8 h-8"></i>
            <span>Törlés</span>
        </button>
    </div>

    <!-- Exit Fullscreen Button -->
    <button id="exitFullscreenBtn" onclick="toggleFullscreen(false)" class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition-all shadow-2xl">
        <i data-lucide="minimize" class="w-6 h-6"></i>
    </button>

    <!-- Controls (Bottom Row) -->
    <div id="controlsContainer" class="fixed bottom-4 left-0 w-full px-4 hidden">
        <div id="categoryGrid" class="grid grid-cols-4 gap-2 max-w-md mx-auto">
             <!-- Dynamic category buttons go here -->
        </div>
    </div>

    <script>
        lucide.createIcons();

        const deck = document.getElementById('deck');
        const emptyMessage = document.getElementById('emptyMessage');
        const remainingCount = document.getElementById('remainingCount');
        const statusText = document.getElementById('statusText');
        const categoryGrid = document.getElementById('categoryGrid');
        const controlsContainer = document.getElementById('controlsContainer');
        
        let activeFileNames = new Set();
        let cardQueue = [];
        let history = null;
        let isAnimating = false;
        let currentRemaining = 0;
        let categories = [];

        function showUndoWarning() {
            const overlay = document.getElementById('undoOverlay');
            const count = parseInt(localStorage.getItem('undo_count') || '0');
            
            if (count > 3) {
                overlay.classList.add('subtle');
            } else {
                overlay.classList.remove('subtle');
            }
            
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            
            localStorage.setItem('undo_count', (count + 1).toString());
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }, 1800);
        }

        function updateRemainingUI(val) {
            currentRemaining = Math.max(0, val);
            remainingCount.textContent = `${currentRemaining} KÉP MARADT`;
        }

        async function fetchCategories() {
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
                renderCategoryButtons();
            } catch (e) {
                console.error("Failed to load categories", e);
            }
        }

        function renderCategoryButtons() {
            categoryGrid.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.onclick = () => classify(cat.name);
                btn.className = "flex flex-col items-center gap-1 p-2 glass-btn rounded-xl active:scale-95 transition-all text-white border border-white/5";
                btn.style.backgroundColor = `${cat.color}15`;
                btn.style.borderColor = `${cat.color}40`;
                
                btn.innerHTML = `
                    <div class="w-7 h-7 rounded-full flex items-center justify-center shadow-lg" style="background-color: ${cat.color}30; color: ${cat.color}; border: 1px solid ${cat.color}50">
                        <i data-lucide="${cat.icon || 'tag'}" class="w-3.5 h-3.5"></i>
                    </div>
                    <span class="text-[9px] font-bold uppercase tracking-tight truncate w-full" style="color: ${cat.color}">${cat.display_name}</span>
                `;
                categoryGrid.appendChild(btn);
            });
            lucide.createIcons();
            controlsContainer.classList.remove('hidden');
            document.getElementById('deleteBtnZone').classList.remove('hidden');
        }

        // PRE-FETCHING LOGIC
        async function fetchNextData() {
            try {
                const params = new URLSearchParams();
                activeFileNames.forEach(fn => params.append('exclude', fn));
                
                const url = `/api/classify/next?${params.toString()}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();
                
                if (data && data.file_name && !data.done) {
                    activeFileNames.add(data.file_name); 
                }
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return { error: true };
            }
        }

        async function replenishQueue() {
            if (cardQueue.length < 3) {
                const data = await fetchNextData();
                if (data && !data.error && !data.done && data.file_name) {
                    cardQueue.push(data);
                    const img = new Image();
                    img.src = data.url;
                    return data;
                }
            }
        }

        function createCardElement(data, isNext = false) {
            const card = document.createElement('div');
            card.className = `card ${isNext ? 'next' : 'current'}`;
            card.dataset.filename = data.file_name;
            card.dataset.url = data.url;
            
            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.url}')">
                    <div class="error-overlay" id="err-${data.file_name.replace(/[^a-z0-9]/gi, '_')}">
                        <i data-lucide="image-off" class="w-8 h-8 mb-2"></i>
                        Hiba a betöltéskor
                    </div>
                </div>
                <div class="card-info p-2 bg-slate-800/80 backdrop-blur-md border-t border-white/5">
                    <p class="text-[9px] truncate font-medium text-slate-400">${data.file_name}</p>
                </div>
            `;

            // Make next card clickable for Undo
            if (isNext) {
                card.onclick = (e) => {
                    e.stopPropagation();
                    undo();
                };
                card.style.cursor = 'pointer';
                card.title = "Az utolsó kép újraosztályozása (undo)";
            }

            const imgChecker = new Image();
            imgChecker.onerror = () => {
                const errBox = card.querySelector('.error-overlay');
                if (errBox) errBox.style.display = 'flex';
            };
            imgChecker.src = data.url;

            lucide.createIcons();
            return card;
        }

        async function initDeck() {
            activeFileNames.clear();
            const d1 = await fetchNextData();
            if (!d1 || d1.done) { showEmpty(d1?.message); return; }
            
            updateRemainingUI(d1.total_remaining);
            const d2 = await fetchNextData();
            
            emptyMessage.style.display = 'none';
            if (d1 && !d1.done) deck.appendChild(createCardElement(d1, false));
            if (d2 && !d2.done) deck.appendChild(createCardElement(d2, true));
            
            replenishQueue();
            replenishQueue();
        }

        async function classify(action) {
            if (isAnimating) return;
            const current = deck.querySelector('.card.current');
            if (!current) return;
            
            isAnimating = true;
            resetZoom(); // Reset zoom state when moving to next card

            // Haptic feedback
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(40);
            }

            const currentFileName = current.dataset.filename;
            const currentUrl = current.dataset.url;

            // Save to history for Undo
            history = { file_name: currentFileName, url: currentUrl, action: action };

            // 1. Immediate UI update
            updateRemainingUI(currentRemaining - 1);

            // 2. Animate current card out (simple fade/scale for buttons)
            current.style.transition = 'transform 0.4s ease-in, opacity 0.3s';
            current.style.transform = `scale(0.8) translateY(-100px)`;
            current.style.opacity = '0';

            // 3. Promote next card
            const next = deck.querySelector('.card.next');
            if (next) {
                next.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                next.classList.replace('next', 'current');
                next.style.border = '2px solid rgba(255,255,255,0.05)';
                next.style.pointerEvents = 'auto';
            }

            // 4. API call (async)
            fetch('/api/classify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_name: currentFileName, action: action })
            }).then(() => {
                activeFileNames.delete(currentFileName);
            }).catch(e => {
                console.error("Save error:", e);
                activeFileNames.delete(currentFileName);
            });

            // 5. Cleanup
            setTimeout(async () => {
                try {
                    current.remove();
                    
                    if (currentRemaining <= 0 && !deck.querySelector('.card.current') && cardQueue.length === 0) {
                        showEmpty("Minden kép besorolva! 🎉");
                        return;
                    }

                    let nextData = cardQueue.shift();
                    if (!nextData && currentRemaining > 0) {
                        nextData = await fetchNextData();
                    }
                    
                    if (nextData && !nextData.done && !nextData.error) {
                        if (!deck.querySelector('.card.current')) {
                             deck.appendChild(createCardElement(nextData, false));
                        } else {
                            deck.appendChild(createCardElement(nextData, true));
                        }
                    } else if (!deck.querySelector('.card')) {
                        showEmpty("Kész! Minden képet besoroltál.");
                    }
                } finally {
                    isAnimating = false;
                    replenishQueue();
                }
            }, 350);
        }

        async function undo() {
            if (!history || isAnimating) return;
            isAnimating = true;
            
            showUndoWarning();

            const undoData = { ...history };
            history = null; // Clear history to prevent double undo

            try {
                // Call API
                const res = await fetch('/api/classify/undo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_name: undoData.file_name, action: undoData.action })
                });

                if (!res.ok) throw new Error("Undo failed on server");

                // UI Logic:
                // 1. Current card becomes Next card
                const current = deck.querySelector('.card.current');
                const next = deck.querySelector('.card.next');
                
                if (next) next.remove(); // Remove the "preview" next
                
                if (current) {
                    current.classList.replace('current', 'next');
                    current.style.pointerEvents = 'auto'; // Enable interaction for next card
                    current.title = "Az utolsó kép újraosztályozása (undo)";
                    // Re-bind click for future undo
                    current.onclick = (e) => { e.stopPropagation(); undo(); };
                }

                // 2. Add history item back as Current
                const prevCard = createCardElement(undoData, false);
                deck.insertBefore(prevCard, deck.firstChild);
                
                // 3. Update count
                updateRemainingUI(currentRemaining + 1);
                
                // 4. Update file tracking
                activeFileNames.add(undoData.file_name);

            } catch (e) {
                console.error("Undo error:", e);
                history = undoData; // Restore history if failed
            } finally {
                isAnimating = false;
            }
        }

        function showEmpty(msg) {
            deck.innerHTML = '';
            emptyMessage.style.display = 'flex';
            deck.appendChild(emptyMessage); // Re-attach it
            
            const loadingState = document.getElementById('loadingState');
            const doneState = document.getElementById('doneState');
            const statusText = document.getElementById('statusText');
            const statusTitle = document.getElementById('statusTitle');

            loadingState.classList.add('hidden');
            doneState.classList.remove('hidden');
            
            if (msg) {
                if (msg.includes("Minden") || msg.includes("Kész")) {
                    statusTitle.textContent = "Nagyszerű!";
                } else {
                    statusTitle.textContent = "Vége szakadt...";
                }
                statusText.textContent = msg;
            }

            remainingCount.textContent = "0 KÉP MARADT";
            controlsContainer.classList.add('hidden');
            const deleteBtn = document.getElementById('deleteBtnZone');
            if (deleteBtn) deleteBtn.classList.add('hidden');
            
            lucide.createIcons();
        }

        // --- PERSISTENT PINCH TO ZOOM & PAN IMPLEMENTATION ---
        let zoomState = {
            scale: 1,
            translateX: 0,
            translateY: 0,
            initialDist: 0,
            initialScale: 1,
            startX: 0,
            startY: 0,
            initialTranslateX: 0,
            initialTranslateY: 0,
            isZooming: false,
            isPanning: false
        };

        function resetZoom() {
            zoomState.scale = 1;
            zoomState.translateX = 0;
            zoomState.translateY = 0;
            const currentImg = deck.querySelector('.card.current .card-image');
            if (currentImg) {
                currentImg.style.transition = 'transform 0.3s ease';
                currentImg.style.transform = 'translate(0px, 0px) scale(1)';
                setTimeout(() => { currentImg.style.transition = ''; }, 300);
            }
        }

        deck.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                zoomState.isZooming = true;
                zoomState.isPanning = false;
                zoomState.initialDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                zoomState.initialScale = zoomState.scale;
            } else if (e.touches.length === 1 && zoomState.scale > 1) {
                zoomState.isPanning = true;
                zoomState.startX = e.touches[0].pageX;
                zoomState.startY = e.touches[0].pageY;
                zoomState.initialTranslateX = zoomState.translateX;
                zoomState.initialTranslateY = zoomState.translateY;
            }
        }, { passive: false });

        deck.addEventListener('touchmove', e => {
            const currentImg = deck.querySelector('.card.current .card-image');
            if (!currentImg) return;

            if (zoomState.isZooming && e.touches.length === 2) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                zoomState.scale = Math.max(1, (currentDist / zoomState.initialDist) * zoomState.initialScale);
                currentImg.style.transform = `translate(${zoomState.translateX}px, ${zoomState.translateY}px) scale(${zoomState.scale})`;
                currentImg.style.zIndex = "500";
            } else if (zoomState.isPanning && e.touches.length === 1) {
                e.preventDefault();
                const deltaX = e.touches[0].pageX - zoomState.startX;
                const deltaY = e.touches[0].pageY - zoomState.startY;
                
                zoomState.translateX = zoomState.initialTranslateX + deltaX;
                zoomState.translateY = zoomState.initialTranslateY + deltaY;
                
                currentImg.style.transform = `translate(${zoomState.translateX}px, ${zoomState.translateY}px) scale(${zoomState.scale})`;
            }
        }, { passive: false });

        deck.addEventListener('touchend', e => {
            if (e.touches.length < 2) zoomState.isZooming = false;
            if (e.touches.length === 0) zoomState.isPanning = false;
        });

        function toggleFullscreen(enable) {
            if (enable) {
                document.body.classList.add('fullscreen-mode');
                // Try to use native API if possible for real immersive feel
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } else {
                document.body.classList.remove('fullscreen-mode');
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
            // Update icons if needed
            lucide.createIcons();
        }

        fetchCategories();
        initDeck();
    </script>
</body>
</html>
