<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotó Szortírozó - V9.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling/zooming during swipes */
        }
        .card-container {
            position: relative;
            width: 90vw;
            height: 65vh;
            max-width: 400px;
            perspective: 1000px;
        }
        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e293b;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: transform 0.1s ease-out;
            cursor: grab;
            display: flex;
            flex-direction: column;
        }
        .card:active { cursor: grabbing; }
        .card-image {
            flex: 1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        .overlay {
            position: absolute;
            top: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
        .overlay-right { right: 20px; color: #22c55e; border: 4px solid #22c55e; transform: rotate(-10deg); }
        .overlay-left { left: 20px; color: #3b82f6; border: 4px solid #3b82f6; transform: rotate(10deg); }
        .overlay-down { bottom: 80px; left: 50%; transform: translateX(-50%); color: #eab308; border: 4px solid #eab308; }
        .overlay-up { top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ef4444; border: 4px solid #ef4444; }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <!-- Header -->
    <div class="fixed top-0 w-full p-4 flex justify-between items-center z-50">
        <button onclick="window.location.href='/'" class="glass-btn p-2 rounded-full text-slate-400">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="flex flex-col items-center">
            <h1 class="text-lg font-bold">Szortírozó</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest" id="remainingCount">Betöltés...</p>
        </div>
        <button onclick="syncSource()" class="glass-btn p-2 rounded-full text-indigo-400" id="syncBtn">
            <i data-lucide="refresh-cw"></i>
        </button>
    </div>

    <!-- Main Container -->
    <div id="deck" class="card-container">
        <!-- New cards will be inserted here -->
        <div class="flex items-center justify-center h-full text-slate-500 italic" id="emptyMessage">
            Scanning for photos...
        </div>
    </div>

    <!-- Instructions / Footer -->
    <div class="fixed bottom-0 w-full p-6 space-y-4">
        <div class="grid grid-cols-4 gap-2">
            <div class="flex flex-col items-center gap-1">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center border border-blue-500/30">
                    <i data-lucide="plane"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-blue-400">Bal: Utazás</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <div class="w-10 h-10 rounded-full bg-green-500/20 text-green-500 flex items-center justify-center border border-green-500/30">
                    <i data-lucide="heart"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-green-400">Jobb: Család</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <div class="w-10 h-10 rounded-full bg-yellow-500/20 text-yellow-500 flex items-center justify-center border border-yellow-500/30">
                    <i data-lucide="leaf"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-yellow-400">Le: Állat</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <div class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center border border-red-500/30">
                    <i data-lucide="trash-2"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-red-400">Fel: Törlés</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const deck = document.getElementById('deck');
        const emptyMessage = document.getElementById('emptyMessage');
        const remainingCount = document.getElementById('remainingCount');
        
        let currentCard = null;
        let startX, startY;
        let isDragging = false;

        async function loadNextCard() {
            try {
                const res = await fetch('/api/classify/next');
                const data = await res.json();

                if (data.done) {
                    emptyMessage.textContent = data.message;
                    emptyMessage.style.display = "flex";
                    remainingCount.textContent = "0 kép maradt";
                    return;
                }

                remainingCount.textContent = `${data.total_remaining} kép maradt`;
                createCard(data.url, data.file_name);
            } catch (e) {
                emptyMessage.textContent = "Hiba történt a betöltéskor.";
            }
        }

        function createCard(url, fileName) {
            emptyMessage.style.display = "none";
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = fileName;
            card.innerHTML = `
                <div class="card-image" style="background-image: url('${url}')"></div>
                <div class="p-4 bg-slate-800/80 backdrop-blur-sm border-t border-white/5">
                    <p class="text-xs truncate font-medium text-slate-400">${fileName}</p>
                </div>
                <div class="overlay overlay-right">CSALÁD</div>
                <div class="overlay overlay-left">UTAZÁS</div>
                <div class="overlay overlay-down">ÁLLATOK</div>
                <div class="overlay overlay-up">TÖRLÉS</div>
            `;

            deck.appendChild(card);
            currentCard = card;
            attachSwipeListeners(card);
        }

        function attachSwipeListeners(card) {
            card.addEventListener('touchstart', handleStart);
            card.addEventListener('mousedown', handleStart);
            
            function handleStart(e) {
                isDragging = true;
                const touch = e.type === 'touchstart' ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                card.style.transition = 'none';
            }
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);

        function handleMove(e) {
            if (!isDragging || !currentCard) return;
            
            const touch = e.type === 'touchmove' ? e.touches[0] : e;
            const deltaX = touch.clientX - startX;
            const deltaY = touch.clientY - startY;

            // Simple movement
            const rotation = deltaX / 10;
            currentCard.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${rotation}deg)`;

            // Overlays
            const opacityX = Math.min(Math.abs(deltaX) / 100, 1);
            const opacityY = Math.min(Math.abs(deltaY) / 100, 1);

            const overlayRight = currentCard.querySelector('.overlay-right');
            const overlayLeft = currentCard.querySelector('.overlay-left');
            const overlayDown = currentCard.querySelector('.overlay-down');
            const overlayUp = currentCard.querySelector('.overlay-up');

            // Reset all
            overlayRight.style.opacity = 0;
            overlayLeft.style.opacity = 0;
            overlayDown.style.opacity = 0;
            overlayUp.style.opacity = 0;

            if (deltaX > 50 && Math.abs(deltaY) < Math.abs(deltaX)) {
                overlayRight.style.opacity = opacityX;
            } else if (deltaX < -50 && Math.abs(deltaY) < Math.abs(deltaX)) {
                overlayLeft.style.opacity = opacityX;
            } else if (deltaY > 50 && Math.abs(deltaX) < Math.abs(deltaY)) {
                overlayDown.style.opacity = opacityY;
            } else if (deltaY < -50 && Math.abs(deltaX) < Math.abs(deltaY)) {
                overlayUp.style.opacity = opacityY;
            }
        }

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        function handleEnd(e) {
            if (!isDragging || !currentCard) return;
            isDragging = false;
            
            const rect = currentCard.getBoundingClientRect();
            const deltaX = (e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX) - startX;
            const deltaY = (e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY) - startY;

            const threshold = 120;
            let action = null;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > threshold) action = "csalad";
                else if (deltaX < -threshold) action = "utazas";
            } else {
                if (deltaY > threshold) action = "allatok";
                else if (deltaY < -threshold) action = "delete";
            }

            if (action) {
                swipeAway(action, deltaX, deltaY);
            } else {
                // Return to center
                currentCard.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                currentCard.style.transform = 'translate(0, 0) rotate(0deg)';
                const overlays = currentCard.querySelectorAll('.overlay');
                overlays.forEach(o => o.style.opacity = 0);
            }
        }

        async function swipeAway(action, deltaX, deltaY) {
            const card = currentCard;
            currentCard = null;

            // Animate off screen
            card.style.transition = 'transform 0.5s ease-in';
            const multiplier = 2; // Shoot far
            card.style.transform = `translate(${deltaX * multiplier}px, ${deltaY * multiplier}px) rotate(${deltaX / 5}deg)`;

            // Call API
            try {
                const fileName = card.dataset.id;
                const res = await fetch('/api/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_name: fileName, action: action })
                });

                if (!res.ok) alert("Hiba a mentés közben!");
                
                setTimeout(() => {
                    card.remove();
                    loadNextCard();
                }, 500);
            } catch (e) {
                alert("Hálózati hiba!");
            }
        }

        async function syncSource() {
            const btn = document.getElementById('syncBtn');
            btn.classList.add('animate-spin', 'pointer-events-none');
            
            try {
                await fetch('/api/classify/sync', { method: 'POST' });
                alert("Automatikus szinkronizáció elindítva!");
                setTimeout(() => {
                  btn.classList.remove('animate-spin', 'pointer-events-none');
                  loadNextCard();
                }, 10000); // Give it some time
            } catch (e) {
                alert("Sikertelen szinkronizáció.");
            }
        }

        // Init
        loadNextCard();

    </script>
</body>
</html>
