<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotó Szortírozó - V10.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
        }

        .deck-container {
            position: relative;
            width: 90vw;
            height: 60vh;
            max-width: 450px;
            margin-top: 10px;
        }

        .card {
            position: absolute;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            border: 2px solid rgba(255,255,255,0.05);
        }

        /* MAIN CARD */
        .card.current {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            opacity: 1;
            transform: scale(1);
        }

        /* THUMBNAIL (NEXT) CARD */
        .card.next {
            z-index: 100; /* Above the current card but small in corner */
            width: 100px;
            height: 140px;
            right: 10px;
            bottom: 10px;
            transform: scale(1);
            opacity: 0.9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 3px solid var(--accent-blue);
            pointer-events: none; /* User interacts with current card */
        }
        
        .card.next .card-info { display: none; } /* Hide text for thumbnail */

        .card-image {
            flex: 1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            position: relative;
        }

        .error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            color: #ef4444;
            font-size: 10px;
            text-align: center;
            padding: 10px;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            z-index: 110;
            white-space: nowrap;
        }

        .overlay-right { color: var(--accent-green); border: 6px solid var(--accent-green); transform: translate(-50%, -50%) rotate(-15deg); }
        .overlay-left { color: var(--accent-blue); border: 6px solid var(--accent-blue); transform: translate(-50%, -50%) rotate(15deg); }
        .overlay-down { color: var(--accent-purple); border: 6px solid var(--accent-purple); }
        .overlay-up { color: var(--accent-red); border: 6px solid var(--accent-red); }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-6">

    <!-- Header -->
    <div class="w-full px-6 flex justify-between items-center z-50">
        <button onclick="window.location.href='/'" class="glass-btn p-3 rounded-2xl text-slate-400">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="flex flex-col items-center">
            <h1 class="text-xl font-bold tracking-tight">Szortírozó <span class="text-xs opacity-40 ml-1">v11.0</span></h1>
            <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest" id="remainingCount">SCANNING...</p>
        </div>
        <button onclick="location.reload()" class="glass-btn p-3 rounded-2xl text-indigo-400">
            <i data-lucide="refresh-cw"></i>
        </button>
    </div>

    <!-- Deck Container -->
    <div id="deck" class="deck-container">
        <!-- Cards injected by JS -->
        <div class="flex flex-col items-center justify-center h-full text-slate-500 italic space-y-4" id="emptyMessage">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <p id="statusText">Portyázás a képek után...</p>
        </div>
    </div>

    <!-- Controls (Dynamic Grid) -->
    <div id="controlsContainer" class="w-full px-4 pb-6 overflow-y-auto hidden" style="max-height: 35vh;">
        <div id="categoryGrid" class="grid grid-cols-2 gap-3 mb-4">
             <!-- Dynamic category buttons go here -->
        </div>
        <button onclick="classify('delete')" class="w-full bg-red-500/20 text-red-500 border border-red-500/30 p-4 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
            <i data-lucide="trash-2"></i> Törlés (Lomtár)
        </button>
    </div>

    <script>
        lucide.createIcons();

        const deck = document.getElementById('deck');
        const emptyMessage = document.getElementById('emptyMessage');
        const remainingCount = document.getElementById('remainingCount');
        const statusText = document.getElementById('statusText');
        const categoryGrid = document.getElementById('categoryGrid');
        const controlsContainer = document.getElementById('controlsContainer');
        
        let activeFileNames = new Set();
        let cardQueue = [];
        let isAnimating = false;
        let currentRemaining = 0;
        let categories = [];

        function updateRemainingUI(val) {
            currentRemaining = Math.max(0, val);
            remainingCount.textContent = `${currentRemaining} KÉP MARADT`;
        }

        async function fetchCategories() {
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
                renderCategoryButtons();
            } catch (e) {
                console.error("Failed to load categories", e);
            }
        }

        function renderCategoryButtons() {
            categoryGrid.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.onclick = () => classify(cat.name);
                btn.className = "flex flex-col items-center gap-1 p-3 glass-btn rounded-2xl active:scale-95 transition-all text-white border border-white/5";
                btn.style.backgroundColor = `${cat.color}15`; // 15% opacity background
                btn.style.borderColor = `${cat.color}40`; // 40% opacity border
                
                btn.innerHTML = `
                    <div class="w-10 h-10 rounded-full flex items-center justify-center shadow-lg" style="background-color: ${cat.color}30; color: ${cat.color}; border: 1px solid ${cat.color}50">
                        <i data-lucide="${cat.icon || 'tag'}"></i>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wide" style="color: ${cat.color}">${cat.display_name}</span>
                `;
                categoryGrid.appendChild(btn);
            });
            lucide.createIcons();
            controlsContainer.classList.remove('hidden');
        }

        // PRE-FETCHING LOGIC
        async function fetchNextData() {
            try {
                const params = new URLSearchParams();
                activeFileNames.forEach(fn => params.append('exclude', fn));
                
                const url = `/api/classify/next?${params.toString()}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();
                
                if (data && data.file_name && !data.done) {
                    activeFileNames.add(data.file_name); 
                }
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return { error: true };
            }
        }

        async function replenishQueue() {
            if (cardQueue.length < 3) {
                const data = await fetchNextData();
                if (data && !data.error && !data.done && data.file_name) {
                    cardQueue.push(data);
                    const img = new Image();
                    img.src = data.url;
                    return data;
                }
            }
        }

        function createCardElement(data, isNext = false) {
            const card = document.createElement('div');
            card.className = `card ${isNext ? 'next' : 'current'}`;
            card.dataset.filename = data.file_name;
            card.dataset.url = data.url;
            
            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.url}')">
                    <div class="error-overlay" id="err-${data.file_name.replace(/[^a-z0-9]/gi, '_')}">
                        <i data-lucide="image-off" class="w-8 h-8 mb-2"></i>
                        Hiba a betöltéskor
                    </div>
                </div>
                <div class="card-info p-3 bg-slate-800/80 backdrop-blur-md border-t border-white/5">
                    <p class="text-[10px] truncate font-medium text-slate-400">${data.file_name}</p>
                </div>
            `;

            const imgChecker = new Image();
            imgChecker.onerror = () => {
                const errBox = card.querySelector('.error-overlay');
                if (errBox) errBox.style.display = 'flex';
            };
            imgChecker.src = data.url;

            lucide.createIcons();
            return card;
        }

        async function initDeck() {
            activeFileNames.clear();
            const d1 = await fetchNextData();
            if (!d1 || d1.done) { showEmpty(d1?.message); return; }
            
            updateRemainingUI(d1.total_remaining);
            const d2 = await fetchNextData();
            
            emptyMessage.style.display = 'none';
            if (d1 && !d1.done) deck.appendChild(createCardElement(d1, false));
            if (d2 && !d2.done) deck.appendChild(createCardElement(d2, true));
            
            replenishQueue();
            replenishQueue();
        }

        async function classify(action) {
            if (isAnimating) return;
            const current = deck.querySelector('.card.current');
            if (!current) return;
            
            isAnimating = true;

            // Haptic feedback
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(40);
            }

            const currentFileName = current.dataset.filename;

            // 1. Immediate UI update
            updateRemainingUI(currentRemaining - 1);

            // 2. Animate current card out (simple fade/scale for buttons)
            current.style.transition = 'transform 0.4s ease-in, opacity 0.3s';
            current.style.transform = `scale(0.8) translateY(-100px)`;
            current.style.opacity = '0';

            // 3. Promote next card
            const next = deck.querySelector('.card.next');
            if (next) {
                next.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                next.classList.replace('next', 'current');
                next.style.border = '2px solid rgba(255,255,255,0.05)';
                next.style.pointerEvents = 'auto';
            }

            // 4. API call (async)
            fetch('/api/classify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_name: currentFileName, action: action })
            }).then(() => {
                activeFileNames.delete(currentFileName);
            }).catch(e => {
                console.error("Save error:", e);
                activeFileNames.delete(currentFileName);
            });

            // 5. Cleanup
            setTimeout(async () => {
                try {
                    current.remove();
                    
                    if (currentRemaining <= 0 && !deck.querySelector('.card.current') && cardQueue.length === 0) {
                        showEmpty("Minden kép besorolva! 🎉");
                        return;
                    }

                    let nextData = cardQueue.shift();
                    if (!nextData && currentRemaining > 0) {
                        nextData = await fetchNextData();
                    }
                    
                    if (nextData && !nextData.done && !nextData.error) {
                        if (!deck.querySelector('.card.current')) {
                             deck.appendChild(createCardElement(nextData, false));
                        } else {
                            deck.appendChild(createCardElement(nextData, true));
                        }
                    } else if (!deck.querySelector('.card')) {
                        showEmpty("Kész! Minden képet besoroltál.");
                    }
                } finally {
                    isAnimating = false;
                    replenishQueue();
                }
            }, 350);
        }

        function showEmpty(msg) {
            deck.innerHTML = '';
            emptyMessage.style.display = 'flex';
            statusText.textContent = msg || "Vége a listának.";
            remainingCount.textContent = "0 KÉP MARADT";
            controlsContainer.classList.add('hidden');
        }

        fetchCategories();
        initDeck();
    </script>
</body>
</html>
</body>
</html>
