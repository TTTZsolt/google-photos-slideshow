<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotó Szortírozó - V9.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
        }

        .card-container {
            position: relative;
            width: 85vw;
            height: 60vh;
            max-width: 400px;
            perspective: 1000px;
            margin-top: 10px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease, 
                        scale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
        }

        /* Top card */
        .card.current {
            z-index: 20;
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Next card (Ghost preview) */
        .card.next {
            z-index: 10;
            transform: scale(0.92) translateY(25px);
            opacity: 0.4;
            pointer-events: none;
        }

        .card-image {
            flex: 1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

        .overlay-right { color: var(--accent-green); border: 6px solid var(--accent-green); transform: translate(-50%, -50%) rotate(-15deg); }
        .overlay-left { color: var(--accent-blue); border: 6px solid var(--accent-blue); transform: translate(-50%, -50%) rotate(15deg); }
        .overlay-down { color: var(--accent-purple); border: 6px solid var(--accent-purple); }
        .overlay-up { color: var(--accent-red); border: 6px solid var(--accent-red); }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-6">

    <!-- Header -->
    <div class="w-full px-6 flex justify-between items-center z-50">
        <button onclick="window.location.href='/'" class="glass-btn p-3 rounded-2xl text-slate-400">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="flex flex-col items-center">
            <h1 class="text-xl font-bold tracking-tight">Szortírozó <span class="text-xs opacity-40 ml-1">v9.2</span></h1>
            <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest" id="remainingCount">SCANNING...</p>
        </div>
        <button onclick="location.reload()" class="glass-btn p-3 rounded-2xl text-indigo-400">
            <i data-lucide="refresh-cw"></i>
        </button>
    </div>

    <!-- Deck Container -->
    <div id="deck" class="card-container">
        <!-- Cards will be injected here -->
        <div class="flex flex-col items-center justify-center h-full text-slate-500 italic space-y-4" id="emptyMessage">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <p id="statusText">Portyázás a képek után...</p>
        </div>
    </div>

    <!-- Quick Controls -->
    <div class="w-full px-6 space-y-6">
        <div class="grid grid-cols-4 gap-3">
            <button onclick="triggerSwipe('left')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center border border-blue-500/30">
                    <i data-lucide="plane"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-blue-400">Utazás</span>
            </button>
            <button onclick="triggerSwipe('right')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-green-500/20 text-green-500 flex items-center justify-center border border-green-500/30">
                    <i data-lucide="heart"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-green-400">Család</span>
            </button>
            <button onclick="triggerSwipe('down')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-purple-500/20 text-purple-500 flex items-center justify-center border border-purple-500/30">
                    <i data-lucide="dog"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-purple-400">Állat</span>
            </button>
            <button onclick="triggerSwipe('up')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center border border-red-500/30">
                    <i data-lucide="trash-2"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-red-400">Törlés</span>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const deck = document.getElementById('deck');
        const emptyMessage = document.getElementById('emptyMessage');
        const remainingCount = document.getElementById('remainingCount');
        const statusText = document.getElementById('statusText');
        
        let cardQueue = [];
        let isAnimating = false;
        let startX, startY;

        // PRE-FETCHING LOGIC
        async function fetchNextData() {
            try {
                const res = await fetch('/api/classify/next');
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return { error: true };
            }
        }

        async function replenishQueue() {
            if (cardQueue.length < 3) {
                const data = await fetchNextData();
                if (data && !data.error && !data.done) {
                    cardQueue.push(data);
                    // Pre-load image in browser cache
                    const img = new Image();
                    img.src = data.url;
                }
                return data;
            }
        }

        // DECK MANAGEMENT
        function createCardElement(data, isNext = false) {
            const card = document.createElement('div');
            card.className = `card ${isNext ? 'next' : 'current'}`;
            card.dataset.filename = data.file_name;
            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.url}')"></div>
                <div class="p-4 bg-slate-800/80 backdrop-blur-md border-t border-white/5">
                    <p class="text-[10px] truncate font-medium text-slate-400">${data.file_name}</p>
                </div>
                <div class="overlay overlay-right">CSALÁD</div>
                <div class="overlay overlay-left">UTAZÁS</div>
                <div class="overlay overlay-down">ÁLLATOK</div>
                <div class="overlay overlay-up">TÖRLÉS</div>
            `;

            if (!isNext) attachDragListeners(card);
            return card;
        }

        async function initDeck() {
            // Fetch first two items
            const d1 = await fetchNextData();
            if (d1.done) { showEmpty(d1.message); return; }
            
            const d2 = await fetchNextData();
            
            emptyMessage.style.display = 'none';
            
            if (d1 && !d1.done) {
                const c1 = createCardElement(d1, false);
                deck.appendChild(c1);
                remainingCount.textContent = `${d1.total_remaining} KÉP MARADT`;
            }
            if (d2 && !d2.done) {
                deck.appendChild(createCardElement(d2, true));
            }
            
            // Start filling the background queue
            replenishQueue();
            replenishQueue();
        }

        function triggerSwipe(direction) {
            const current = deck.querySelector('.card.current');
            if (!current || isAnimating) return;
            
            const dx = direction === 'left' ? -200 : (direction === 'right' ? 200 : 0);
            const dy = direction === 'up' ? -200 : (direction === 'down' ? 200 : 0);
            performSwipe(current, direction, dx, dy);
        }

        async function performSwipe(card, direction, deltaX, deltaY) {
            if (isAnimating) return;
            isAnimating = true;

            const actionMap = { 'right': 'család', 'left': 'utazás', 'down': 'állatok', 'up': 'delete' };
            const action = actionMap[direction];

            // 1. Animate out
            card.style.transition = 'transform 0.5s ease-in, opacity 0.3s';
            card.style.transform = `translate(${deltaX * 5}px, ${deltaY * 5}px) rotate(${deltaX / 5}deg)`;
            card.style.opacity = '0';

            // 2. Promote the next card immediately
            const next = deck.querySelector('.card.next');
            if (next) {
                next.classList.replace('next', 'current');
                next.style.pointerEvents = 'auto';
                attachDragListeners(next);
            }

            // 3. API Call in background
            const fileName = card.dataset.filename;
            fetch('/api/classify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_name: fileName, action: action })
            });

            // 4. Cleanup and Replenish
            setTimeout(async () => {
                card.remove();
                isAnimating = false;
                
                // Add new 'next' card if available in queue or fetch
                let nextData = cardQueue.shift();
                if (!nextData) nextData = await fetchNextData();
                
                if (nextData && !nextData.done && !nextData.error) {
                    deck.appendChild(createCardElement(nextData, true));
                    remainingCount.textContent = `${nextData.total_remaining} KÉP MARADT`;
                } else if (!deck.querySelector('.card')) {
                    showEmpty("Kész! Minden képet besoroltál.");
                }
                
                replenishQueue(); // Keep queue full
            }, 400);
        }

        // DRAG LOGIC
        function attachDragListeners(card) {
            let startDragX, startDragY;
            
            const onStart = (e) => {
                if (isAnimating) return;
                const t = e.type.includes('touch') ? e.touches[0] : e;
                startDragX = t.clientX;
                startDragY = t.clientY;
                card.style.transition = 'none';
            };

            const onMove = (e) => {
                if (startDragX === undefined || isAnimating) return;
                const t = e.type.includes('touch') ? e.touches[0] : e;
                const dx = t.clientX - startDragX;
                const dy = t.clientY - startDragY;

                card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 15}deg)`;
                
                // Overlays
                const ox = Math.min(Math.abs(dx) / 100, 1);
                const oy = Math.min(Math.abs(dy) / 100, 1);
                
                card.querySelectorAll('.overlay').forEach(o => o.style.opacity = 0);
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 40) card.querySelector('.overlay-right').style.opacity = ox;
                    else if (dx < -40) card.querySelector('.overlay-left').style.opacity = ox;
                } else {
                    if (dy > 40) card.querySelector('.overlay-down').style.opacity = oy;
                    else if (dy < -40) card.querySelector('.overlay-up').style.opacity = oy;
                }
            };

            const onEnd = (e) => {
                if (startDragX === undefined || isAnimating) return;
                const t = e.type.includes('touch') ? e.changedTouches[0] : e;
                const dx = t.clientX - startDragX;
                const dy = t.clientY - startDragY;
                startDragX = undefined;

                const threshold = 100;
                if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                    let dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
                    performSwipe(card, dir, dx, dy);
                } else {
                    card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.transform = '';
                    card.querySelectorAll('.overlay').forEach(o => o.style.opacity = 0);
                }
            };

            card.addEventListener('mousedown', onStart);
            card.addEventListener('touchstart', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        function showEmpty(msg) {
            deck.innerHTML = '';
            emptyMessage.style.display = 'flex';
            statusText.textContent = msg || "Vége a listának.";
            remainingCount.textContent = "0 KÉP MARADT";
        }

        initDeck();
    </script>
</body>
</html>
