<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotó Szortírozó - V9.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
        }

        .deck-container {
            position: relative;
            width: 90vw;
            height: 60vh;
            max-width: 450px;
            margin-top: 10px;
        }

        .card {
            position: absolute;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            border: 2px solid rgba(255,255,255,0.05);
        }

        /* MAIN CARD */
        .card.current {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            opacity: 1;
            transform: scale(1);
        }

        /* THUMBNAIL (NEXT) CARD */
        .card.next {
            z-index: 100; /* Above the current card but small in corner */
            width: 100px;
            height: 140px;
            right: 10px;
            bottom: 10px;
            transform: scale(1);
            opacity: 0.9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 3px solid var(--accent-blue);
            pointer-events: none; /* User interacts with current card */
        }
        
        .card.next .card-info { display: none; } /* Hide text for thumbnail */

        .card-image {
            flex: 1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            position: relative;
        }

        .error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            color: #ef4444;
            font-size: 10px;
            text-align: center;
            padding: 10px;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            z-index: 110;
            white-space: nowrap;
        }

        .overlay-right { color: var(--accent-green); border: 6px solid var(--accent-green); transform: translate(-50%, -50%) rotate(-15deg); }
        .overlay-left { color: var(--accent-blue); border: 6px solid var(--accent-blue); transform: translate(-50%, -50%) rotate(15deg); }
        .overlay-down { color: var(--accent-purple); border: 6px solid var(--accent-purple); }
        .overlay-up { color: var(--accent-red); border: 6px solid var(--accent-red); }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-6">

    <!-- Header -->
    <div class="w-full px-6 flex justify-between items-center z-50">
        <button onclick="window.location.href='/'" class="glass-btn p-3 rounded-2xl text-slate-400">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="flex flex-col items-center">
            <h1 class="text-xl font-bold tracking-tight">Szortírozó <span class="text-xs opacity-40 ml-1">v9.12</span></h1>
            <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest" id="remainingCount">SCANNING...</p>
        </div>
        <button onclick="location.reload()" class="glass-btn p-3 rounded-2xl text-indigo-400">
            <i data-lucide="refresh-cw"></i>
        </button>
    </div>

    <!-- Deck Container -->
    <div id="deck" class="deck-container">
        <!-- Cards injected by JS -->
        <div class="flex flex-col items-center justify-center h-full text-slate-500 italic space-y-4" id="emptyMessage">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <p id="statusText">Portyázás a képek után...</p>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full px-6 space-y-4">
        <div class="grid grid-cols-4 gap-3" id="controlsGrid">
            <button onclick="triggerSwipe('left')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center border border-blue-500/30">
                    <i data-lucide="plane"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-blue-400">Utazás</span>
            </button>
            <button onclick="triggerSwipe('down')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-green-500/20 text-green-500 flex items-center justify-center border border-green-500/30">
                    <i data-lucide="heart"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-green-400">Család</span>
            </button>
            <button onclick="triggerSwipe('up')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center border border-red-500/30">
                    <i data-lucide="trash-2"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-red-400">Törlés</span>
            </button>
            <button onclick="triggerSwipe('right')" class="flex flex-col items-center gap-2 p-3 glass-btn rounded-2xl">
                <div class="w-10 h-10 rounded-full bg-purple-500/20 text-purple-500 flex items-center justify-center border border-purple-500/30">
                    <i data-lucide="paw-print"></i>
                </div>
                <span class="text-[9px] font-bold uppercase text-purple-400">Állatok</span>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const deck = document.getElementById('deck');
        const emptyMessage = document.getElementById('emptyMessage');
        const remainingCount = document.getElementById('remainingCount');
        const statusText = document.getElementById('statusText');
        const controlsGrid = document.getElementById('controlsGrid');
        
        let activeFileNames = new Set();
        let cardQueue = [];
        let isAnimating = false;
        let startDragX, startDragY;
        let currentRemaining = 0;

        function updateRemainingUI(val) {
            currentRemaining = Math.max(0, val);
            remainingCount.textContent = `${currentRemaining} KÉP MARADT`;
            
            if (currentRemaining <= 0 && activeFileNames.size > 0) {
                // If count is 0, we should transition to done as soon as cards are gone
            }
        }

        // PRE-FETCHING LOGIC
        async function fetchNextData() {
            try {
                const params = new URLSearchParams();
                activeFileNames.forEach(fn => params.append('exclude', fn));
                
                const url = `/api/classify/next?${params.toString()}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();
                
                if (data && data.file_name && !data.done) {
                    activeFileNames.add(data.file_name); 
                }
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return { error: true };
            }
        }

        async function replenishQueue() {
            if (cardQueue.length < 3) {
                const data = await fetchNextData();
                if (data && !data.error && !data.done && data.file_name) {
                    cardQueue.push(data);
                    const img = new Image();
                    img.src = data.url;
                }
                return data;
            }
        }

        function createCardElement(data, isNext = false) {
            const card = document.createElement('div');
            card.className = `card ${isNext ? 'next' : 'current'}`;
            card.dataset.filename = data.file_name;
            card.dataset.url = data.url;
            
            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.url}')">
                    <div class="error-overlay" id="err-${data.file_name.replace(/[^a-z0-9]/gi, '_')}">
                        <i data-lucide="image-off" class="w-8 h-8 mb-2"></i>
                        Hiba a betöltéskor
                    </div>
                </div>
                <div class="card-info p-3 bg-slate-800/80 backdrop-blur-md border-t border-white/5">
                    <p class="text-[10px] truncate font-medium text-slate-400">${data.file_name}</p>
                </div>
                <div class="overlay overlay-right">ÁLLATOK</div>
                <div class="overlay overlay-left">UTAZÁS</div>
                <div class="overlay overlay-down">CSALÁD</div>
                <div class="overlay overlay-up">TÖRLÉS</div>
            `;

            const imgChecker = new Image();
            imgChecker.onerror = () => {
                const errBox = card.querySelector('.error-overlay');
                if (errBox) errBox.style.display = 'flex';
            };
            imgChecker.src = data.url;

            if (!isNext) attachDragListeners(card);
            lucide.createIcons();
            return card;
        }

        async function initDeck() {
            activeFileNames.clear();
            const d1 = await fetchNextData();
            if (!d1 || d1.done) { showEmpty(d1?.message); return; }
            
            updateRemainingUI(d1.total_remaining);
            const d2 = await fetchNextData();
            
            emptyMessage.style.display = 'none';
            if (d1 && !d1.done) deck.appendChild(createCardElement(d1, false));
            if (d2 && !d2.done) deck.appendChild(createCardElement(d2, true));
            
            replenishQueue();
            replenishQueue();
        }

        function triggerSwipe(direction) {
            if (isAnimating) return;
            const current = deck.querySelector('.card.current');
            if (!current) return;
            const dx = direction === 'left' ? -250 : (direction === 'right' ? 250 : 0);
            const dy = direction === 'up' ? -250 : (direction === 'down' ? 250 : 0);
            performSwipe(current, direction, dx, dy);
        }

        async function performSwipe(card, direction, deltaX, deltaY) {
            if (isAnimating || !card) return;
            isAnimating = true;

            const actionMap = { 'right': 'állatok', 'left': 'utazás', 'down': 'család', 'up': 'delete' };
            const action = actionMap[direction];
            const currentFileName = card.dataset.filename;

            // 1. Immediate UI update
            updateRemainingUI(currentRemaining - 1);

            // Calculate throw trajectory to ensure it leaves the screen
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY) || 1;
            const throwX = (deltaX / distance) * 1500;
            const throwY = (deltaY / distance) * 1500;

            // 2. Animate current card out
            card.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s';
            card.style.transform = `translate(${throwX}px, ${throwY}px) rotate(${deltaX / 5}deg)`;
            card.style.opacity = '0';

            // 3. Promote next card
            const next = deck.querySelector('.card.next');
            if (next) {
                next.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                next.classList.replace('next', 'current');
                next.style.border = '2px solid rgba(255,255,255,0.05)';
                next.style.pointerEvents = 'auto';
                attachDragListeners(next);
            }

            // 4. API call (async)
            fetch('/api/classify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_name: currentFileName, action: action })
            }).then(() => {
                activeFileNames.delete(currentFileName);
            }).catch(e => {
                console.error("Save error:", e);
                activeFileNames.delete(currentFileName);
            });

            // 5. Cleanup
            setTimeout(async () => {
                card.remove();
                
                if (currentRemaining <= 0) {
                    showEmpty("Minden kép besorolva! 🎉");
                    isAnimating = false;
                    return;
                }

                let nextData = cardQueue.shift();
                if (!nextData) nextData = await fetchNextData();
                
                if (nextData && !nextData.done && !nextData.error) {
                    const nextCard = createCardElement(nextData, true);
                    deck.appendChild(nextCard);
                } else if (!deck.querySelector('.card')) {
                    showEmpty("Kész! Minden képet besoroltál.");
                }
                
                isAnimating = false;
                replenishQueue();
            }, 400);
        }

        function attachDragListeners(card) {
            const onStart = (e) => {
                if (isAnimating) return;
                const t = e.type.includes('touch') ? e.touches[0] : e;
                startDragX = t.clientX;
                startDragY = t.clientY;
                card.style.transition = 'none';
            };

            const onMove = (e) => {
                if (startDragX === undefined || isAnimating) return;
                const t = e.type.includes('touch') ? e.touches[0] : e;
                const dx = t.clientX - startDragX;
                const dy = t.clientY - startDragY;

                card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 15}deg)`;
                
                const ox = Math.min(Math.abs(dx) / 80, 1);
                const oy = Math.min(Math.abs(dy) / 80, 1);
                
                card.querySelectorAll('.overlay').forEach(o => o.style.opacity = 0);
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30) card.querySelector('.overlay-right').style.opacity = ox;
                    else if (dx < -30) card.querySelector('.overlay-left').style.opacity = ox;
                } else {
                    if (dy > 30) card.querySelector('.overlay-down').style.opacity = oy;
                    else if (dy < -30) card.querySelector('.overlay-up').style.opacity = oy;
                }
            };

            const onEnd = (e) => {
                if (startDragX === undefined || isAnimating) return;
                const t = e.type.includes('touch') ? e.changedTouches[0] : e;
                const dx = t.clientX - startDragX;
                const dy = t.clientY - startDragY;
                startDragX = undefined;

                const threshold = 75;
                if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                    let dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
                    performSwipe(card, dir, dx, dy);
                } else {
                    card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.transform = '';
                    card.querySelectorAll('.overlay').forEach(o => o.style.opacity = 0);
                }
            };

            card.addEventListener('mousedown', onStart);
            card.addEventListener('touchstart', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        function showEmpty(msg) {
            deck.innerHTML = '';
            emptyMessage.style.display = 'flex';
            statusText.textContent = msg || "Vége a listának.";
            remainingCount.textContent = "0 KÉP MARADT";
        }

        initDeck();
    </script>
</body>
</html>
