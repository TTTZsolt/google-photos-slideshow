<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>B2 Slideshow Receiver</title>

    <!-- Design & Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
        }

        /* Fullscreen Slideshow Layers */
        .image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 2.0s ease-in-out;
            opacity: 0;
            z-index: 10;
        }

        .active {
            opacity: 1;
            z-index: 20;
        }

        /* Filename Overlay */
        .filename-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            z-index: 100;
            transition: opacity 1.0s ease-in-out;
            opacity: 0;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .filename-visible {
            opacity: 1;
        }

        /* Setup Modal Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .switch-peer:checked~.switch-target {
            background-color: #6366f1;
        }

        .switch-peer:checked~.switch-target::after {
            transform: translateX(100%);
        }

        /* Scrollbar styling for folder list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .fs-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .fs-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.6);
        }

        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .back-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .cast-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .cast-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(34, 197, 94, 0.5);
            color: #4ade80;
        }

        .flag-btn {
            position: absolute;
            bottom: 20px;
            right: 140px;
            /* Positioned left of the cast button */
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .flag-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(234, 179, 8, 0.5);
            color: #facc15;
        }

        /* Success Notification */
        .notification-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 4000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .notification-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- Slideshow Images -->
    <div id="img1" class="image-container"></div>
    <div id="img2" class="image-container active"></div>
    <div id="filename" class="filename-overlay"></div>

    <button class="fs-btn" onclick="toggleFullscreen()">
        <i data-lucide="maximize" class="w-4 h-4"></i>
        <span>Fullscreen</span>
    </button>

    <button id="backBtn" class="back-btn hidden" onclick="stopAndChangeFolder()">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Change Folder</span>
    </button>

    <button id="flagBtn" class="flag-btn hidden" onclick="flagCurrentImg()" title="Flag for Retouch (Shortcut: R)">
        <i data-lucide="wand-2" class="w-5 h-5"></i>
        <span>Flag Image</span>
    </button>

    <button id="castBtn" class="cast-btn hidden" onclick="openCastModal()">
        <i data-lucide="cast" class="w-5 h-5"></i>
        <span>Cast to TV</span>
    </button>

    <!-- Cast Modal Overlay -->
    <div id="castModal"
        class="fixed inset-0 z-[3000] flex items-center justify-center bg-black/60 backdrop-blur-md hidden transition-opacity duration-300">
        <div
            class="glass-panel w-full max-w-sm rounded-3xl shadow-2xl flex flex-col m-4 overflow-hidden border border-white/40 p-6">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 mb-4">
                <i data-lucide="cast" class="text-indigo-500 w-5 h-5"></i>
                Select Display
            </h2>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notificationToast" class="notification-toast">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        <span id="notificationText">Saved</span>
    </div>

    <!-- Setup Modal Overlay -->
    <div id="setupModal"
        class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/50 backdrop-blur-md hidden transition-opacity duration-500">
        <div
            class="glass-panel w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col m-4 overflow-hidden border border-white/40">

            <!-- Header -->
            <div class="p-6 border-b border-white/40 flex justify-between items-center bg-white/40 relative">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-50/50 to-purple-50/50 z-0"></div>
                <div class="relative z-10 flex w-full justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="folders" class="text-indigo-500 w-6 h-6"></i>
                            Slideshow Setup
                        </h2>
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1">Select a folder to
                            begin</p>
                    </div>
                </div>
            </div>

            <!-- Path Breadcrumbs -->
            <div class="px-6 py-4 bg-white/60 border-b border-white/50 flex items-center gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap"
                id="breadcrumbContainer">
                <!-- Javascript will populate this -->
            </div>

            <!-- Folder List -->
            <div class="p-4 flex-1 overflow-y-auto custom-scrollbar min-h-[40vh] bg-slate-50/50 relative"
                id="folderListContainer">
                <div id="loadingSpinner"
                    class="absolute inset-0 flex items-center justify-center hidden bg-white/50 z-10">
                    <i data-lucide="loader-2" class="w-8 h-8 text-indigo-500 animate-spin"></i>
                </div>
                <!-- Javascript will populate folders here -->
                <div id="folderList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </div>

            <!-- Footer / Global Settings -->
            <div class="p-6 bg-white/80 border-t border-white/50 space-y-4">
                <div class="flex flex-col sm:flex-row gap-6 items-center justify-between">

                    <div class="flex gap-6 items-center">
                        <!-- Interval Setting -->
                        <div class="flex items-center gap-3">
                            <div
                                class="bg-indigo-50 w-10 h-10 flex items-center justify-center rounded-xl shadow-inner border border-indigo-100 text-indigo-500">
                                <i data-lucide="timer" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col justify-center">
                                <label
                                    class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Interval</label>
                                <div class="flex items-baseline gap-1">
                                    <input type="number" id="setupInterval" value="20" min="1"
                                        class="w-10 bg-transparent border-0 p-0 text-lg font-bold focus:ring-0 text-slate-700 h-6">
                                    <span class="text-sm font-bold text-slate-400">s</span>
                                </div>
                            </div>
                        </div>

                        <!-- Filename Toggle -->
                        <div class="flex items-center gap-3 ml-2">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <span
                                    class="text-[11px] font-bold text-slate-500 uppercase tracking-widest leading-tight">Show<br>Names</span>
                                <div class="relative inline-flex items-center">
                                    <input type="checkbox" id="setupShowFilename" class="sr-only switch-peer">
                                    <div
                                        class="w-11 h-6 bg-slate-200 rounded-full transition-all switch-target after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all shadow-inner">
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Device Name Input -->
                    <div class="flex flex-1 max-w-xs items-center gap-3">
                        <div class="relative w-full">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="tag" class="w-4 h-4 text-slate-400"></i>
                            </div>
                            <input type="text" id="setupDeviceName" placeholder="Eszköz neve (Opcionális)"
                                class="w-full bg-slate-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-xl py-2.5 pl-10 pr-4 text-sm font-bold text-slate-700 shadow-sm transition-all placeholder:font-normal placeholder:text-slate-400">
                        </div>
                    </div>

                    <!-- Start Global (All Folders) -->
                    <button onclick="startSlideshow(null)"
                        class="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition shadow-lg shrink-0 group">
                        <i data-lucide="shuffle"
                            class="w-5 h-5 group-hover:rotate-180 transition-transform duration-500"></i>
                        Shuffle Everything
                    </button>

                </div>
            </div>

        </div>
    </div>

    <!-- YouTube Player (Hidden) -->
    <div id="youtubePlayer" class="hidden"></div>
    <div id="musicControls"
        class="fixed bottom-6 right-6 z-50 flex gap-2 hidden group opacity-30 hover:opacity-100 transition-opacity">
        <button id="playPauseBtn" onclick="togglePlayback()"
            class="w-12 h-12 bg-white/20 backdrop-blur-md border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white/40 transition-colors shadow-lg">
            <i data-lucide="music" class="w-5 h-5"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        let config = {
            folder: null,
            intervalMs: 20000,
            showFilename: false,
            isRunning: false,
            deviceName: null
        };
        let currentImg = 1;
        let lastUrl = "";
        let actualCurrentFilename = ""; // Tracks the file name independently of the UI display
        let currentPath = ""; // Empty string means root
        const sessionId = Math.random().toString(36).substring(2, 15); // Unique session ID for smart shuffle deck
        let heartbeatInterval = null;
        let slideshowTimer = null;

        // DOM Elements
        const modal = document.getElementById('setupModal');
        const folderList = document.getElementById('folderList');
        const breadcrumbContainer = document.getElementById('breadcrumbContainer');
        const spinner = document.getElementById('loadingSpinner');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Try memory for device name, then URL
            config.deviceName = urlParams.get('device_name') || localStorage.getItem('b2_device_name') || null;
            if (config.deviceName) {
                localStorage.setItem('b2_device_name', config.deviceName);
            }

            // Populate input
            const setupNameInput = document.getElementById('setupDeviceName');
            if (setupNameInput && config.deviceName) {
                setupNameInput.value = config.deviceName;
            }

            // Auto-start check
            if (urlParams.has('folder') || urlParams.has('start_global')) {
                config.folder = urlParams.get('folder') || null;
                config.intervalMs = parseInt(urlParams.get('interval') || 20) * 1000;
                config.showFilename = urlParams.get('show_filename') === 'true';
                startEngine();
            } else {
                // Show setup modal
                modal.classList.remove('hidden');
                loadFolders("");
            }
        });

        // Setup Modal Logic
        async function loadFolders(path) {
            currentPath = path;
            renderBreadcrumbs();
            folderList.innerHTML = '';
            spinner.classList.remove('hidden');

            try {
                const queryStr = path ? `?parent=${encodeURIComponent(path)}` : '';
                const response = await fetch(`/api/folders${queryStr}`);
                if (!response.ok) throw new Error("Failed to load");
                const data = await response.json();

                spinner.classList.add('hidden');

                if (data.folders.length === 0) {
                    folderList.innerHTML = `<div class="col-span-1 sm:col-span-2 text-center py-10 bg-white/50 rounded-2xl border border-dashed border-slate-300">
                        <i data-lucide="folder-x" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                        <span class="text-slate-400 font-bold uppercase tracking-widest text-sm">No items here</span>
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                data.folders.forEach(f => {
                    const el = document.createElement('div');
                    el.className = "bg-white p-2 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between hover:border-indigo-300 transition-all hover:-translate-y-0.5 group group-folder";
                    el.innerHTML = `
                        <button onclick="loadFolders('${f.path}')" class="flex items-center gap-3 flex-1 text-left px-2 py-1 overflow-hidden" title="Open Folder">
                            <div class="bg-indigo-50 p-2.5 rounded-xl text-indigo-500 group-hover:bg-indigo-500 group-hover:text-white transition-colors shrink-0">
                                <i data-lucide="folder" class="w-5 h-5 fill-indigo-100 group-hover:fill-indigo-400 transition-colors"></i>
                            </div>
                            <span class="font-bold text-slate-700 truncate tracking-tight text-[15px]">${f.name}</span>
                        </button>
                        <button onclick="startSlideshow('${f.path}')" class="p-3 text-emerald-500 hover:bg-emerald-50 hover:text-emerald-600 rounded-xl group/play relative transition-colors" title="Play from here">
                            <i data-lucide="play-circle" class="w-6 h-6 hover:scale-110 transition-transform"></i>
                            <div class="absolute right-0 bottom-full mb-2 bg-slate-800 text-white text-[10px] uppercase font-bold px-2 py-1 rounded opacity-0 group-hover/play:opacity-100 whitespace-nowrap pointer-events-none transition-opacity z-10 transition-delay-300">
                                Play Directory
                            </div>
                        </button>
                    `;
                    folderList.appendChild(el);
                });
                lucide.createIcons();

            } catch (e) {
                spinner.classList.add('hidden');
                folderList.innerHTML = `<div class="col-span-2 text-center text-rose-500 font-bold py-8">Error loading folders</div>`;
            }
        }

        function renderBreadcrumbs() {
            breadcrumbContainer.innerHTML = '';

            // Root
            const rootBtn = document.createElement('button');
            rootBtn.className = "text-[13px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1.5 shrink-0 px-2 py-1 rounded-lg hover:bg-indigo-50 transition-colors";
            rootBtn.innerHTML = '<i data-lucide="hard-drive" class="w-4 h-4"></i> B2 Root';
            rootBtn.onclick = () => loadFolders("");
            breadcrumbContainer.appendChild(rootBtn);

            if (!currentPath) {
                lucide.createIcons();
                return;
            }

            const parts = currentPath.split('/').filter(p => p !== '');
            let builtPath = "";
            parts.forEach((part, index) => {
                // Separator
                const sep = document.createElement('div');
                sep.className = "text-slate-300 px-0.5 flex items-center";
                sep.innerHTML = '<i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>';
                breadcrumbContainer.appendChild(sep);

                builtPath += (index === 0 ? part : "/" + part);
                const isLast = (index === parts.length - 1);

                const btn = document.createElement('button');
                btn.className = `text-[13px] font-bold px-2 py-1 rounded-lg transition-colors shrink-0 ${isLast ? 'text-slate-800 bg-slate-100' : 'text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50'}`;
                btn.innerText = part;
                if (!isLast) {
                    const targetPath = builtPath; // closure
                    btn.onclick = () => loadFolders(targetPath + '/');
                }
                breadcrumbContainer.appendChild(btn);
            });
            lucide.createIcons();

            // Scroll to end of breadcrumbs
            breadcrumbContainer.scrollLeft = breadcrumbContainer.scrollWidth;
        }

        function startSlideshow(folderPath) {
            config.folder = folderPath;
            config.intervalMs = parseInt(document.getElementById('setupInterval').value || 20) * 1000;
            config.showFilename = document.getElementById('setupShowFilename').checked;

            const nameInput = document.getElementById('setupDeviceName');
            if (nameInput && nameInput.value.trim() !== '') {
                config.deviceName = nameInput.value.trim();
                localStorage.setItem('b2_device_name', config.deviceName);
            }

            // Hide Modal smoothly
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 500);

            startEngine();
        }

        // --- Slideshow Engine Logic ---
        function startEngine() {
            if (config.isRunning) return;
            config.isRunning = true;

            // Update URL parameters for sharing / casting
            const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname
                + '?start_global=true'
                + (config.folder ? '&folder=' + encodeURIComponent(config.folder) : '')
                + `&interval=${config.intervalMs / 1000}`
                + `&show_filename=${config.showFilename}`;
            window.history.pushState({ path: newurl }, '', newurl);

            // Fetch immediately, then start interval
            fetchNextImage();
            if (slideshowTimer) clearInterval(slideshowTimer);
            slideshowTimer = setInterval(fetchNextImage, config.intervalMs);

            // Start heartbeat
            sendHeartbeat();
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(sendHeartbeat, 5000);

            // Show the Stop/Change Folder, Flag, and Cast buttons
            const backBtn = document.getElementById('backBtn');
            const castBtn = document.getElementById('castBtn');
            const flagBtn = document.getElementById('flagBtn');

            if (backBtn) backBtn.classList.remove('hidden');
            if (castBtn) castBtn.classList.remove('hidden');
            if (flagBtn) flagBtn.classList.remove('hidden');

            // Keyboard shortcut listener (R key)
            document.addEventListener('keydown', handleKeyboardShortcuts);

            initializeYouTubeMusic();
        }

        function stopAndChangeFolder() {
            if (!config.isRunning) return;
            config.isRunning = false;

            // Clear timers
            if (slideshowTimer) clearInterval(slideshowTimer);
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            // Hide the buttons
            const backBtn = document.getElementById('backBtn');
            const castBtn = document.getElementById('castBtn');
            const flagBtn = document.getElementById('flagBtn');

            if (backBtn) backBtn.classList.add('hidden');
            if (castBtn) castBtn.classList.add('hidden');
            if (flagBtn) flagBtn.classList.add('hidden');

            document.removeEventListener('keydown', handleKeyboardShortcuts);

            // Clear images & filename
            const img1 = document.getElementById('img1');
            const img2 = document.getElementById('img2');
            img1.style.backgroundImage = 'none';
            img2.style.backgroundImage = 'none';
            img1.classList.remove('active');
            img2.classList.remove('active');

            const filenameEl = document.getElementById('filename');
            if (filenameEl) filenameEl.classList.remove('filename-visible');

            // Reset URL
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({ path: cleanUrl }, '', cleanUrl);

            // Pause music
            if (ytPlayer && isPlaying) {
                ytPlayer.pauseVideo();
            }

            // Show setup modal smoothly
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                loadFolders(currentPath); // Refresh the current view
            }, 50);
        }

        async function sendHeartbeat() {
            if (!config.isRunning) return;
            try {
                const params = new URLSearchParams();
                if (config.folder) params.append("folder", config.folder);
                if (config.deviceName) params.append("device_name", config.deviceName);

                const res = await fetch(`/api/heartbeat/${sessionId}?${params.toString()}`, { method: 'POST' });
                if (!res.ok) {
                    if (res.status === 403) {
                        stopEngineAdmin();
                    }
                }
            } catch (e) {
                console.log("Heartbeat failed", e);
            }
        }

        async function openCastModal() {
            document.getElementById('castModal').classList.remove('hidden');
            document.getElementById('castLoading').classList.remove('hidden');
            document.getElementById('castDeviceList').innerHTML = '';

            try {
                const response = await fetch('/slideshow/devices');
                const data = await response.json();

                document.getElementById('castLoading').classList.add('hidden');

                if (data.devices && data.devices.length > 0) {
                    data.devices.forEach(dev => {
                        const btn = document.createElement('button');
                        btn.className = "p-3 bg-white/60 hover:bg-indigo-50 text-slate-700 font-bold rounded-xl border border-slate-200 text-left transition-colors flex items-center gap-3 w-full";
                        btn.innerHTML = `<i data-lucide="tv" class="w-4 h-4 text-indigo-500 shrink-0"></i> <span class="truncate">${dev}</span>`;
                        btn.onclick = () => initiateCast(dev);
                        document.getElementById('castDeviceList').appendChild(btn);
                    });
                    lucide.createIcons();
                } else {
                    document.getElementById('castDeviceList').innerHTML = '<p class="text-center text-rose-500 font-bold py-4">No TVs found on network</p>';
                }
            } catch (e) {
                document.getElementById('castLoading').classList.add('hidden');
                document.getElementById('castDeviceList').innerHTML = '<p class="text-center text-rose-500 font-bold py-4">Error searching for TVs</p>';
            }
        }

        function closeCastModal() {
            document.getElementById('castModal').classList.add('hidden');
        }

        async function initiateCast(device) {
            closeCastModal();

            // Collect current params to forward to backend
            const params = new URLSearchParams();
            if (config.folder) params.append("folder", config.folder);
            if (config.intervalMs) params.append("interval", config.intervalMs / 1000);
            if (config.showFilename !== undefined) params.append("show_filename", config.showFilename);
            if (config.deviceName) params.append("device_name", config.deviceName);

            try {
                const queryStr = params.toString() ? '&' + params.toString() : '';
                const res = await fetch(`/slideshow/cast?device_name=${encodeURIComponent(device)}${queryStr}`, { method: 'POST' });
                if (res.ok) {
                    alert(`Elküldve a következő TV-re: ${device}!`);
                } else {
                    alert('Hiba történt a kiküldés során.');
                }
            } catch (e) {
                alert('Hálózati hiba a casting során.');
            }
        }

        function stopEngineAdmin() {
            config.isRunning = false;
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            const errDiv = document.createElement('div');
            errDiv.className = "fixed inset-0 z-[3000] bg-black/90 flex flex-col items-center justify-center text-white p-8 text-center backdrop-blur-md transition-opacity duration-1000";
            errDiv.innerHTML = `
                <i data-lucide="shield-alert" class="w-24 h-24 text-rose-500 mb-6 drop-shadow-lg"></i>
                <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-500">Connection Terminated</h1>
                <p class="text-lg md:text-xl text-slate-300 font-medium">A feladatot az Adminisztrátor leállította.</p>
                <button onclick="window.location.reload()" class="mt-8 px-8 py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl transition-all font-bold tracking-wide shadow-lg hover:shadow-xl hover:-translate-y-1">Újra próbál</button>
            `;
            document.body.appendChild(errDiv);
            lucide.createIcons();

            if (ytPlayer && isPlaying) {
                ytPlayer.pauseVideo();
            }
        }

        async function fetchNextImage() {
            try {
                const queryParams = new URLSearchParams({ session_id: sessionId });
                if (config.folder) {
                    queryParams.append('folder', config.folder);
                }

                const response = await fetch(`/api/media/random?${queryParams.toString()}`);
                if (!response.ok) return;
                const data = await response.json();

                // Save actual file name for Retouch Queue (Flagging), regardless of display setting
                if (data.filename) {
                    actualCurrentFilename = data.filename;
                }

                // Handle Filename Overlay
                const filenameEl = document.getElementById('filename');
                if (config.showFilename && data.filename) {
                    filenameEl.textContent = data.filename;
                    filenameEl.classList.add('filename-visible');
                } else {
                    filenameEl.classList.remove('filename-visible');
                }

                // Handle Image Transition
                if (data.url && data.url !== lastUrl) {
                    lastUrl = data.url;

                    const nextId = currentImg === 1 ? 'img2' : 'img1';
                    const currId = currentImg === 1 ? 'img1' : 'img2';

                    const nextEl = document.getElementById(nextId);
                    const currEl = document.getElementById(currId);

                    const img = new Image();
                    img.src = data.url;
                    img.onload = () => {
                        nextEl.style.backgroundImage = `url('${data.url}')`;
                        nextEl.classList.add('active');
                        currEl.classList.remove('active');
                        currentImg = currentImg === 1 ? 2 : 1;
                    };
                }
            } catch (e) {
                console.error("Slideshow fetch error:", e);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- Image Flagging Logic ---
        function handleKeyboardShortcuts(e) {
            // 'R' or 'r' key mapped to retouch flag
            if (e.key === 'r' || e.key === 'R') {
                flagCurrentImg();
            }
        }

        async function flagCurrentImg() {
            if (!config.isRunning) return;

            if (!actualCurrentFilename || actualCurrentFilename === "") return;

            // Visual feedback on button
            const fb = document.getElementById('flagBtn');
            fb.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Mentés...</span>';
            lucide.createIcons();

            try {
                const res = await fetch('/api/flags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_name: actualCurrentFilename })
                });
                const data = await res.json();
                showNotification(data.message || "Megjelölve!");
            } catch (e) {
                showNotification("Hálózati hiba mentéskor!");
            } finally {
                fb.innerHTML = '<i data-lucide="wand-2" class="w-5 h-5"></i><span>Flag Image</span>';
                lucide.createIcons();
            }
        }

        function showNotification(msg) {
            const toast = document.getElementById('notificationToast');
            const textEl = document.getElementById('notificationText');
            textEl.textContent = msg;
            toast.classList.add('notification-visible');
            setTimeout(() => {
                toast.classList.remove('notification-visible');
            }, 3000);
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.querySelector('.fs-btn');
            btn.style.opacity = document.fullscreenElement ? '0' : '0.2';
            btn.style.pointerEvents = document.fullscreenElement ? 'none' : 'auto';
        });

        // --- YouTube Audio Integration ---
        let ytPlayer = null;
        let isPlaying = false;

        async function initializeYouTubeMusic() {
            try {
                const res = await fetch('/music/config');
                const conf = await res.json();

                if (!conf.music_enabled || !conf.youtube_playlist_id) return;

                document.getElementById('musicControls').classList.remove('hidden');

                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

                window.onYouTubeIframeAPIReady = () => {
                    let playerConfig = {
                        height: '0', width: '0',
                        playerVars: {
                            'autoplay': 1, 'controls': 0, 'loop': 1, 'playsinline': 1,
                            'origin': window.location.origin
                        },
                        events: {
                            'onReady': (e) => {
                                e.target.setVolume(conf.volume || 50);
                                e.target.playVideo();
                            },
                            'onStateChange': (e) => {
                                isPlaying = (e.data === YT.PlayerState.PLAYING);
                                updatePlayPauseBtn();
                            }
                        }
                    };

                    if (conf.youtube_playlist_id.startsWith('PL')) {
                        playerConfig.playerVars.listType = 'playlist';
                        playerConfig.playerVars.list = conf.youtube_playlist_id;
                    } else {
                        playerConfig.videoId = conf.youtube_playlist_id;
                        playerConfig.playerVars.playlist = conf.youtube_playlist_id;
                    }

                    ytPlayer = new YT.Player('youtubePlayer', playerConfig);
                };
            } catch (e) {
                console.log("Music init failed:", e);
            }
        }

        function togglePlayback() {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function updatePlayPauseBtn() {
            const icon = document.querySelector('#playPauseBtn i');
            if (isPlaying) {
                icon.setAttribute('data-lucide', 'pause');
            } else {
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }
    </script>
</body>

</html>
