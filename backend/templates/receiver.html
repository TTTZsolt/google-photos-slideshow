<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina - Receiver V{{ version }}</title>

    <!-- Design & Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
        }

        /* Fullscreen Slideshow Layers */
        .image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 2.0s ease-in-out;
            opacity: 0;
            z-index: 10;
        }

        .active {
            opacity: 1;
            z-index: 20;
        }

        /* Filename Overlay */
        .filename-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            z-index: 100;
            transition: opacity 1.0s ease-in-out;
            opacity: 0;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .filename-visible {
            opacity: 1;
        }

        /* Setup Modal Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .switch-peer:checked~.switch-target {
            background-color: #6366f1;
        }

        .switch-peer:checked~.switch-target::after {
            transform: translateX(100%);
        }

        /* Scrollbar styling for folder list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .fs-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .fs-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.6);
        }

        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .back-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .cast-btn {
            position: absolute;
            bottom: 20px;
            left: 76px; /* Moved near Exit button */
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .back-btn.hidden,
        .flag-btn.hidden {
            display: none !important;
        }

        .cast-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(34, 197, 94, 0.5);
            color: #4ade80;
        }

        .flag-btn {
            position: absolute;
            bottom: 20px;
            right: 76px;
            /* Positioned left of the cast button */
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .flag-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(234, 179, 8, 0.5);
            color: #facc15;
        }

        .next-btn {
            position: absolute;
            bottom: 20px;
            right: 20px; /* Original Cast position */
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .next-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
            color: #6366f1;
        }

        .next-btn.hidden {
            display: none !important;
        }

        /* Success Notification */
        .notification-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 4000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .notification-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Custom Modal for Alerts */
        #customModal.show { display: flex; }
        #customModal.show #modalContent { transform: scale(1); opacity: 1; }
        
        .modal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-btn:active { transform: scale(0.95); }
        
        .modal-btn-primary {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2);
        }
        .modal-btn-primary:hover { background-color: #4338ca; }
        
        .modal-btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
        }
        .modal-btn-secondary:hover { background-color: #e2e8f0; }
    </style>
</head>

<body>

    <!-- Slideshow Images -->
    <div id="img1" class="image-container"></div>
    <div id="img2" class="image-container active"></div>
    <div id="filename" class="filename-overlay"></div>

    <button class="fs-btn" onclick="toggleFullscreen()" title="Fullscreen">
        <i data-lucide="maximize" class="w-5 h-5"></i>
    </button>

    <button id="backBtn" class="back-btn hidden" onclick="stopAndChangeFolder()" title="Change Folder">
        <i data-lucide="log-out" class="w-5 h-5"></i>
    </button>

    <button id="flagBtn" class="flag-btn hidden" onclick="flagCurrentImg()" title="Flag for Retouch (Shortcut: R)">
        <i data-lucide="wand-2" class="w-5 h-5"></i>
    </button>

    <button id="castBtn" class="cast-btn hidden" onclick="openCastModal()" title="Cast to TV">
        <i data-lucide="cast" class="w-5 h-5"></i>
    </button>

    <button id="nextBtn" class="next-btn hidden" onclick="nextImage()" title="Next Image (Immediate)">
        <i data-lucide="skip-forward" class="w-5 h-5"></i>
    </button>

    <!-- Cast Modal Overlay -->
    <div id="castModal"
        class="fixed inset-0 z-[3000] flex items-center justify-center bg-black/60 backdrop-blur-md hidden transition-opacity duration-300">
        <div
            class="glass-panel w-full max-w-sm rounded-3xl shadow-2xl flex flex-col m-4 overflow-hidden border border-white/40 p-6">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 mb-4">
                <i data-lucide="cast" class="text-indigo-500 w-5 h-5"></i>
                Select Display
            </h2>
            <div id="castLoading" class="text-center py-4 text-slate-500 font-bold text-sm hidden">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-400"></i>
                Searching network...
            </div>
            <div id="castDeviceList" class="flex flex-col gap-2 max-h-[40vh] overflow-y-auto custom-scrollbar"></div>
            <button onclick="closeCastModal()"
                class="mt-6 w-full py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Mégse</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notificationToast" class="notification-toast">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        <span id="notificationText">Saved</span>
    </div>

    <!-- Custom Modal for Alerts/Confirmations -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100000] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all scale-95 opacity-0 duration-300" id="modalContent">
            <div class="p-6 text-slate-800">
                <div class="flex items-center gap-3 mb-4 text-indigo-600">
                    <div class="bg-indigo-50 p-2 rounded-xl">
                        <i id="modalIcon" data-lucide="info" class="w-6 h-6"></i>
                    </div>
                    <h3 class="font-bold text-lg" id="modalTitle">Közlendő</h3>
                </div>
                <p class="text-slate-600 text-sm leading-relaxed mb-6" id="modalMessage"></p>
                <div class="flex gap-3" id="modalButtons">
                </div>
            </div>
        </div>
    </div>

    <!-- Setup Modal Overlay -->
    <div id="setupModal"
        class="fixed inset-0 z-[2000] flex items-start justify-center bg-black/50 backdrop-blur-md hidden transition-opacity duration-500 overflow-y-auto">
        
        <div class="flex flex-col items-start w-full max-w-2xl mx-auto px-4 py-6">
            
            <div class="w-full flex items-start justify-between mb-5">
                <!-- Főoldal Button (Left-aligned, Proportional spacing) -->
                <button onclick="window.location.href='/'" class="flex flex-col items-center gap-1 group transition-all hover:scale-105 active:scale-95 no-underline ml-2">
                    <div class="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm border border-indigo-200/50">
                        <i data-lucide="home" class="w-7 h-7"></i>
                    </div>
                    <span class="text-[11px] font-black text-indigo-400 group-hover:text-white uppercase tracking-widest transition-colors">Főoldal</span>
                </button>

                <!-- Lumina Branding -->
                <div class="flex items-start">
                    <span class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600 tracking-tighter select-none leading-none">Lumina</span>
                </div>
            </div>

            <div class="glass-panel w-full rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-white/40" style="max-height: 80vh;">

                <!-- Header -->
                <div class="p-6 border-b border-white/40 flex flex-col items-center bg-white/40 relative gap-6">
                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-50/50 to-purple-50/50 z-0"></div>
                    
                    <div class="relative z-10 w-full flex flex-col items-start px-2">
                        <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="folders" class="text-indigo-500 w-6 h-6"></i>
                            Slideshow Setup <span class="text-[10px] text-indigo-400 font-black ml-1">V{{ version }}</span>
                        </h2>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-0.5 ml-8">Select a folder to begin</p>
                    </div>

                    <!-- Shuffle Button BELOW title, centered -->
                    <button onclick="startSlideshow(null)"
                        class="relative z-10 bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-10 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition shadow-lg shrink-0 group h-12 w-3/4">
                        <i data-lucide="shuffle" class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500"></i>
                        Shuffle All Photos
                    </button>

                    <!-- Date-range quick picks + custom range -->
                    <div class="relative z-10 w-3/4 flex flex-col gap-2 -mt-2">
                        <div class="flex gap-2">
                            <button onclick="setQuickDateRange(30)" type="button"
                                class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-xl font-bold text-xs transition">
                                Utolsó hónap
                            </button>
                            <button onclick="setQuickDateRange(7)" type="button"
                                class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-xl font-bold text-xs transition">
                                Utolsó hét
                            </button>
                            <button onclick="setQuickDateRange(1)" type="button"
                                class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-xl font-bold text-xs transition">
                                Utolsó nap
                            </button>
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="date" id="setupDateFrom"
                                class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                            <span class="text-slate-400 text-xs font-bold">-</span>
                            <input type="date" id="setupDateTo"
                                class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                        </div>
                        <button onclick="startDateRangeSlideshow()" type="button"
                            class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-10 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition shadow-lg group h-12">
                            <i data-lucide="calendar-days" class="w-4 h-4 group-hover:rotate-12 transition-transform duration-500"></i>
                            Lejátszás a kiválasztott időszakból
                        </button>
                    </div>
                </div>

            <!-- Path Breadcrumbs -->
            <div class="px-6 py-4 bg-white/60 border-b border-white/50 flex items-center gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap"
                id="breadcrumbContainer">
                <!-- Javascript will populate this -->
            </div>

            <!-- Folder List -->
            <div class="p-4 flex-1 h-0 overflow-y-auto custom-scrollbar bg-slate-50/50 relative"
                id="folderListContainer">
                <div id="loadingSpinner"
                    class="absolute inset-0 flex items-center justify-center hidden bg-white/50 z-10">
                    <i data-lucide="loader-2" class="w-8 h-8 text-indigo-500 animate-spin"></i>
                </div>
                <!-- Javascript will populate folders here -->
                <div id="folderList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </div>

            <!-- Footer / Global Settings -->
            <div class="p-4 bg-white/80 border-t border-white/50">
                <div class="flex flex-col gap-3 items-stretch sm:flex-row sm:flex-wrap sm:items-center sm:justify-between px-2">

                    <!-- Interval & Toggle Group -->
                    <div class="flex flex-wrap gap-4 items-center justify-center px-1 sm:px-0">
                        <!-- Interval Setting -->
                        <div class="flex items-center gap-2">
                            <div
                                class="bg-indigo-50 w-8 h-8 flex items-center justify-center rounded-xl shadow-inner border border-indigo-100 text-indigo-500">
                                <i data-lucide="timer" class="w-4 h-4 text-indigo-500"></i>
                            </div>
                            <div class="flex flex-col justify-center">
                                <label
                                    class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Idő</label>
                                <div class="flex items-baseline gap-1">
                                    <input type="number" id="setupInterval" value="240" min="1"
                                        class="w-14 bg-transparent border-0 p-0 text-base font-bold focus:ring-0 text-slate-700 h-5">
                                    <span class="text-xs font-bold text-slate-400">s</span>
                                </div>
                            </div>
                        </div>

                        <!-- Filename Toggle -->
                        <div class="flex items-center gap-3">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span
                                    class="text-[9px] font-bold text-slate-500 uppercase tracking-widest leading-tight">Nevek</span>
                                <div class="relative inline-flex items-center">
                                    <input type="checkbox" id="setupShowFilename" class="sr-only switch-peer">
                                    <div
                                        class="w-9 h-5 bg-slate-200 rounded-full transition-all switch-target after:absolute after:top-[3px] after:left-[3px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all shadow-inner">
                                    </div>
                                </div>
                            </label>
                        </div>
                        
                        <!-- Category Toggle -->
                        <div class="flex items-center gap-3">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span
                                    class="text-[9px] font-bold text-slate-500 uppercase tracking-widest leading-tight">Kateg.</span>
                                <div class="relative inline-flex items-center">
                                    <input type="checkbox" id="setupShowCategory" class="sr-only switch-peer" checked>
                                    <div
                                        class="w-9 h-5 bg-slate-200 rounded-full transition-all switch-target after:absolute after:top-[3px] after:left-[3px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all shadow-inner">
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Category Selector -->
                    <div class="flex items-center gap-2 bg-slate-100/50 sm:bg-transparent p-1 px-3 sm:px-0 rounded-xl">
                        <div class="bg-purple-50 w-8 h-8 flex items-center justify-center rounded-xl shadow-inner border border-purple-100 text-purple-500 shrink-0">
                            <i data-lucide="filter" class="w-4 h-4"></i>
                        </div>
                        <div class="flex flex-col justify-center min-w-[100px]">
                            <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Kategória</label>
                            <select id="setupCategory" class="bg-transparent border-0 p-0 text-xs font-bold focus:ring-0 text-slate-700 cursor-pointer">
                                <option value="">Összes kép</option>
                            </select>
                        </div>
                    </div>

                    <!-- Device Name Input -->
                    <div class="flex items-center gap-2">
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                <i data-lucide="tag" class="w-3 h-3 text-slate-400"></i>
                            </div>
                            <input type="text" id="setupDeviceName" placeholder="Név..."
                                class="w-24 sm:w-28 bg-slate-100/80 border-transparent focus:bg-white border focus:border-indigo-500 focus:ring-0 rounded-xl py-1.5 pl-8 pr-2 text-xs font-bold text-slate-700 shadow-sm transition-all placeholder:font-normal placeholder:text-slate-400">
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- YouTube Player (Hidden) -->
    <div id="youtubePlayer" class="hidden"></div>
    <div id="musicControls"
        class="fixed bottom-6 right-6 z-50 flex gap-2 hidden group opacity-30 hover:opacity-100 transition-opacity">
        <button id="playPauseBtn" onclick="togglePlayback()"
            class="w-12 h-12 bg-white/20 backdrop-blur-md border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white/40 transition-colors shadow-lg">
            <i data-lucide="music" class="w-5 h-5"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        let config = {
            folder: null,
            category: null,
            dateFrom: null,
            dateTo: null,
            intervalMs: 240000,
            showFilename: false,
            showCategory: true,
            isRunning: false,
            deviceName: null
        };
        let currentImg = 1;
        let lastUrl = "";
        let actualCurrentFilename = ""; // Tracks the file name independently of the UI display
        let currentPath = ""; // Empty string means root
        const sessionId = Math.random().toString(36).substring(2, 15); // Unique session ID for smart shuffle deck
        let heartbeatInterval = null;
        let slideshowTimer = null;
        let wakeLock = null;

        // --- Screen Wake Lock logic ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock is active');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock was released');
                    });
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && config.isRunning) {
                await requestWakeLock();
            }
        });

        // DOM Elements
        const modal = document.getElementById('setupModal');
        const folderList = document.getElementById('folderList');
        const breadcrumbContainer = document.getElementById('breadcrumbContainer');
        const spinner = document.getElementById('loadingSpinner');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Try memory for device name, then URL
            config.deviceName = urlParams.get('device_name') || localStorage.getItem('b2_device_name') || null;
            if (config.deviceName) {
                localStorage.setItem('b2_device_name', config.deviceName);
            }

            // Populate input
            const setupNameInput = document.getElementById('setupDeviceName');
            if (setupNameInput && config.deviceName) {
                setupNameInput.value = config.deviceName;
            }

            // Auto-start check
            if (urlParams.has('folder') || urlParams.has('start_global')) {
                config.folder = urlParams.get('folder') || null;
                config.category = urlParams.get('category') || null;
                config.dateFrom = urlParams.get('date_from') || null;
                config.dateTo = urlParams.get('date_to') || null;
                config.intervalMs = parseInt(urlParams.get('interval') || 240) * 1000;
                config.showFilename = urlParams.get('show_filename') === 'true';
                config.showCategory = urlParams.get('show_category') !== 'false';
                startEngine();
            } else {
                // Show setup modal
                modal.classList.remove('hidden');
                loadFolders("");
                fetchCategories();
            }
        });

        async function fetchCategories() {
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                const sel = document.getElementById('setupCategory');
                sel.innerHTML = '<option value="">Összes kép</option>';
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.name;
                    opt.innerText = cat.display_name;
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load categories", e);
            }
        }

        // Setup Modal Logic
        async function loadFolders(path) {
            currentPath = path;
            renderBreadcrumbs();
            folderList.innerHTML = '';
            spinner.classList.remove('hidden');

            try {
                const queryStr = path ? `?parent=${encodeURIComponent(path)}` : '';
                const response = await fetch(`/api/folders${queryStr}`);
                if (!response.ok) throw new Error("Failed to load");
                const data = await response.json();

                spinner.classList.add('hidden');

                if (data.folders.length === 0) {
                    folderList.innerHTML = `<div class="col-span-1 sm:col-span-2 text-center py-10 bg-white/50 rounded-2xl border border-dashed border-slate-300">
                        <i data-lucide="folder-x" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                        <span class="text-slate-400 font-bold uppercase tracking-widest text-sm">No items here</span>
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                data.folders.forEach(f => {
                    const el = document.createElement('div');
                    el.className = "bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between hover:border-indigo-200 transition-all hover:-translate-y-0.5 group group-folder";
                    el.innerHTML = `
                        <button onclick="loadFolders('${f.path}')" class="flex items-center gap-3 flex-1 text-left px-2 py-0.5 overflow-hidden" title="Open Folder">
                            <div class="bg-indigo-50 p-2 rounded-xl text-indigo-500 group-hover:bg-indigo-500 group-hover:text-white transition-colors shrink-0">
                                <i data-lucide="folder" class="w-4 h-4 fill-indigo-100 group-hover:fill-indigo-400 transition-colors"></i>
                            </div>
                            <span class="font-bold text-slate-700 truncate tracking-tight text-sm">${f.name}</span>
                        </button>
                        <button onclick="startSlideshow('${f.path}')" class="p-2 text-emerald-500 hover:bg-emerald-50 hover:text-emerald-600 rounded-xl group/play relative transition-colors" title="Play from here">
                            <i data-lucide="play-circle" class="w-6 h-6 hover:scale-110 transition-transform"></i>
                            <div class="absolute right-0 bottom-full mb-2 bg-slate-800 text-white text-[10px] uppercase font-bold px-2 py-1 rounded opacity-0 group-hover/play:opacity-100 whitespace-nowrap pointer-events-none transition-opacity z-10 transition-delay-300">
                                Play Directory
                            </div>
                        </button>
                    `;
                    folderList.appendChild(el);
                });
                lucide.createIcons();

            } catch (e) {
                spinner.classList.add('hidden');
                folderList.innerHTML = `<div class="col-span-2 text-center text-rose-500 font-bold py-8">Error loading folders</div>`;
            }
        }

        function renderBreadcrumbs() {
            breadcrumbContainer.innerHTML = '';

            // Root
            const rootBtn = document.createElement('button');
            rootBtn.className = "text-[13px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1.5 shrink-0 px-2 py-1 rounded-lg hover:bg-indigo-50 transition-colors";
            rootBtn.innerHTML = '<i data-lucide="hard-drive" class="w-4 h-4"></i> B2 Root';
            rootBtn.onclick = () => loadFolders("");
            breadcrumbContainer.appendChild(rootBtn);

            if (!currentPath) {
                lucide.createIcons();
                return;
            }

            const parts = currentPath.split('/').filter(p => p !== '');
            let builtPath = "";
            parts.forEach((part, index) => {
                // Separator
                const sep = document.createElement('div');
                sep.className = "text-slate-300 px-0.5 flex items-center";
                sep.innerHTML = '<i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>';
                breadcrumbContainer.appendChild(sep);

                builtPath += (index === 0 ? part : "/" + part);
                const isLast = (index === parts.length - 1);

                const btn = document.createElement('button');
                btn.className = `text-[13px] font-bold px-2 py-1 rounded-lg transition-colors shrink-0 ${isLast ? 'text-slate-800 bg-slate-100' : 'text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50'}`;
                btn.innerText = part;
                if (!isLast) {
                    const targetPath = builtPath; // closure
                    btn.onclick = () => loadFolders(targetPath + '/');
                }
                breadcrumbContainer.appendChild(btn);
            });
            lucide.createIcons();

            // Scroll to end of breadcrumbs
            breadcrumbContainer.scrollLeft = breadcrumbContainer.scrollWidth;
        }

        function formatDateInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function setQuickDateRange(days) {
            const today = new Date();
            const from = new Date(today);
            from.setDate(from.getDate() - days);
            document.getElementById('setupDateFrom').value = formatDateInput(from);
            document.getElementById('setupDateTo').value = formatDateInput(today);
        }

        function startDateRangeSlideshow() {
            const from = document.getElementById('setupDateFrom').value;
            const to = document.getElementById('setupDateTo').value;
            if (!from || !to) {
                showCustomModal({
                    title: "Hiányzó dátum",
                    message: "Kérlek válassz kezdő és záró dátumot (vagy nyomj meg egy gyorsgombot: Utolsó hónap/hét/nap).",
                    icon: "calendar-x",
                    confirmText: "Értem"
                });
                return;
            }
            startSlideshow(null, from, to);
        }

        function startSlideshow(folderPath, dateFrom, dateTo) {
            config.folder = folderPath;
            config.category = document.getElementById('setupCategory').value || null;
            config.dateFrom = dateFrom || null;
            config.dateTo = dateTo || null;
            config.intervalMs = parseInt(document.getElementById('setupInterval').value || 240) * 1000;
            config.showFilename = document.getElementById('setupShowFilename').checked;
            config.showCategory = document.getElementById('setupShowCategory') ? document.getElementById('setupShowCategory').checked : true;

            const nameInput = document.getElementById('setupDeviceName');
            if (nameInput && nameInput.value.trim() !== '') {
                config.deviceName = nameInput.value.trim();
                localStorage.setItem('b2_device_name', config.deviceName);
            }

            // Hide Modal smoothly
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 500);

            startEngine();
        }

        // --- Slideshow Engine Logic ---
        function startEngine() {
            if (config.isRunning) return;
            config.isRunning = true;

            // Update URL parameters for sharing / casting
            const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname
                + '?start_global=true'
                + (config.folder ? '&folder=' + encodeURIComponent(config.folder) : '')
                + (config.category ? '&category=' + encodeURIComponent(config.category) : '')
                + (config.dateFrom ? '&date_from=' + encodeURIComponent(config.dateFrom) : '')
                + (config.dateTo ? '&date_to=' + encodeURIComponent(config.dateTo) : '')
                + `&interval=${config.intervalMs / 1000}`
                + `&show_filename=${config.showFilename}`
                + `&show_category=${config.showCategory}`;
            window.history.pushState({ path: newurl }, '', newurl);

            // Fetch immediately, then start interval
            fetchNextImage();
            if (slideshowTimer) clearInterval(slideshowTimer);
            slideshowTimer = setInterval(fetchNextImage, config.intervalMs);

            // Start heartbeat
            sendHeartbeat();
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(sendHeartbeat, 5000);

            // Show the Stop/Change Folder, Flag, and Cast buttons
            const backBtn = document.getElementById('backBtn');
            const castBtn = document.getElementById('castBtn');
            const flagBtn = document.getElementById('flagBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (backBtn) backBtn.classList.remove('hidden');
            if (castBtn) castBtn.classList.remove('hidden');
            if (flagBtn) flagBtn.classList.remove('hidden');
            if (nextBtn) nextBtn.classList.remove('hidden');

            // Keyboard shortcut listener (R key)
            document.addEventListener('keydown', handleKeyboardShortcuts);

            initializeYouTubeMusic();
            requestWakeLock();
        }

        function stopAndChangeFolder() {
            if (!config.isRunning) return;
            config.isRunning = false;

            // Clear timers
            if (slideshowTimer) clearInterval(slideshowTimer);
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            // Hide the buttons
            const backBtn = document.getElementById('backBtn');
            const castBtn = document.getElementById('castBtn');
            const flagBtn = document.getElementById('flagBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (backBtn) backBtn.classList.add('hidden');
            if (castBtn) castBtn.classList.add('hidden');
            if (flagBtn) flagBtn.classList.add('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');

            document.removeEventListener('keydown', handleKeyboardShortcuts);

            // Clear images & filename
            const img1 = document.getElementById('img1');
            const img2 = document.getElementById('img2');
            img1.style.backgroundImage = 'none';
            img2.style.backgroundImage = 'none';
            img1.classList.remove('active');
            img2.classList.remove('active');

            const filenameEl = document.getElementById('filename');
            if (filenameEl) filenameEl.classList.remove('filename-visible');

            // Reset URL
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({ path: cleanUrl }, '', cleanUrl);

            // Pause music
            if (ytPlayer && isPlaying) {
                ytPlayer.pauseVideo();
            }

            // Show setup modal smoothly
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                loadFolders(currentPath); // Refresh the current view
            }, 50);

            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        async function sendHeartbeat() {
            if (!config.isRunning) return;
            try {
                const params = new URLSearchParams();
                if (config.folder) params.append("folder", config.folder);
                if (config.category) params.append("category", config.category);
                if (config.deviceName) params.append("device_name", config.deviceName);

                const res = await fetch(`/api/heartbeat/${sessionId}?${params.toString()}`, { method: 'POST' });
                if (!res.ok) {
                    if (res.status === 403) {
                        stopEngineAdmin();
                    }
                }
            } catch (e) {
                console.log("Heartbeat failed", e);
            }
        }

        async function openCastModal() {
            document.getElementById('castModal').classList.remove('hidden');
            document.getElementById('castLoading').classList.remove('hidden');
            document.getElementById('castDeviceList').innerHTML = '';

            try {
                const response = await fetch('/slideshow/devices');
                const data = await response.json();

                document.getElementById('castLoading').classList.add('hidden');

                if (data.devices && data.devices.length > 0) {
                    data.devices.forEach(dev => {
                        const btn = document.createElement('button');
                        btn.className = "p-3 bg-white/60 hover:bg-indigo-50 text-slate-700 font-bold rounded-xl border border-slate-200 text-left transition-colors flex items-center gap-3 w-full";
                        btn.innerHTML = `<i data-lucide="tv" class="w-4 h-4 text-indigo-500 shrink-0"></i> <span class="truncate">${dev}</span>`;
                        btn.onclick = () => initiateCast(dev);
                        document.getElementById('castDeviceList').appendChild(btn);
                    });
                    lucide.createIcons();
                } else {
                    document.getElementById('castDeviceList').innerHTML = '<p class="text-center text-rose-500 font-bold py-4">No TVs found on network</p>';
                }
            } catch (e) {
                document.getElementById('castLoading').classList.add('hidden');
                document.getElementById('castDeviceList').innerHTML = '<p class="text-center text-rose-500 font-bold py-4">Error searching for TVs</p>';
            }
        }

        function closeCastModal() {
            document.getElementById('castModal').classList.add('hidden');
        }

        async function initiateCast(device) {
            closeCastModal();

            // Collect current params to forward to backend
            const params = new URLSearchParams();
            if (config.folder) params.append("folder", config.folder);
            if (config.category) params.append("category", config.category);
            if (config.dateFrom) params.append("date_from", config.dateFrom);
            if (config.dateTo) params.append("date_to", config.dateTo);
            if (config.intervalMs) params.append("interval", config.intervalMs / 1000);
            if (config.showFilename !== undefined) params.append("show_filename", config.showFilename);
            if (config.showCategory !== undefined) params.append("show_category", config.showCategory);
            if (config.deviceName) params.append("device_name", config.deviceName);

            try {
                const queryStr = params.toString() ? '&' + params.toString() : '';
                const res = await fetch(`/slideshow/cast?device_name=${encodeURIComponent(device)}${queryStr}`, { method: 'POST' });
                if (res.ok) {
                    alert(`Elküldve a következő TV-re: ${device}!`);
                } else {
                    alert('Hiba történt a kiküldés során.');
                }
            } catch (e) {
                alert('Hálózati hiba a casting során.');
            }
        }

        function stopEngineAdmin() {
            config.isRunning = false;
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            const errDiv = document.createElement('div');
            errDiv.className = "fixed inset-0 z-[3000] bg-black/90 flex flex-col items-center justify-center text-white p-8 text-center backdrop-blur-md transition-opacity duration-1000";
            errDiv.innerHTML = `
                <i data-lucide="shield-alert" class="w-24 h-24 text-rose-500 mb-6 drop-shadow-lg"></i>
                <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-500">Connection Terminated</h1>
                <p class="text-lg md:text-xl text-slate-300 font-medium">A feladatot az Adminisztrátor leállította.</p>
                <button onclick="window.location.reload()" class="mt-8 px-8 py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl transition-all font-bold tracking-wide shadow-lg hover:shadow-xl hover:-translate-y-1">Újra próbál</button>
            `;
            document.body.appendChild(errDiv);
            lucide.createIcons();

            if (ytPlayer && isPlaying) {
                ytPlayer.pauseVideo();
            }
        }

        async function fetchNextImage() {
            try {
                const queryParams = new URLSearchParams({ session_id: sessionId });
                if (config.folder) {
                    queryParams.append('folder', config.folder);
                }
                if (config.category) {
                    queryParams.append('category', config.category);
                }
                if (config.dateFrom) {
                    queryParams.append('date_from', config.dateFrom);
                }
                if (config.dateTo) {
                    queryParams.append('date_to', config.dateTo);
                }

                const response = await fetch(`/api/media/random?${queryParams.toString()}`);
                
                if (response.status === 404) {
                    // No images found flow - Stop first
                    if (config.isRunning) {
                        stopAndChangeFolder();
                    }
                    
                    showCustomModal({
                        title: "Nincsenek képek",
                        message: "A kiválasztott mappában és kategóriában nem található egyetlen kép sem. Kérlek változtass a beállításokon!",
                        icon: "search-x",
                        confirmText: "Értem",
                        onConfirm: () => {
                            // Ensure setup modal is visible and fresh
                            modal.classList.remove('hidden');
                            modal.style.opacity = '1';
                        }
                    });
                    return;
                }

                if (!response.ok) return;
                const data = await response.json();

                // Save actual file name for Retouch Queue (Flagging), regardless of display setting
                if (data.file_path) {
                    actualCurrentFilename = data.file_path;
                } else if (data.filename) { // Fallback just in case
                    actualCurrentFilename = data.filename;
                }

                // Handle Filename Overlay
                const filenameEl = document.getElementById('filename');
                let overlayHtml = '';
                
                if (config.showCategory && data.category_info) {
                    overlayHtml += `<span style="color: ${data.category_info.color}; font-weight: bold; margin-right: 8px;">
                                        <i data-lucide="${data.category_info.icon}" style="display:inline-block; width:16px; height:16px; vertical-align:-3px; margin-right:4px;"></i>
                                        ${data.category_info.display_name}
                                    </span>`;
                }

                if (config.showFilename && data.filename) {
                    overlayHtml += `<span class="text-slate-200">${data.filename}</span>`;
                }
                
                if (overlayHtml !== '') {
                    filenameEl.innerHTML = overlayHtml;
                    filenameEl.classList.add('filename-visible');
                    lucide.createIcons();
                } else {
                    filenameEl.classList.remove('filename-visible');
                }

                // Handle Image Transition
                if (data.url && data.url !== lastUrl) {
                    lastUrl = data.url;

                    const nextId = currentImg === 1 ? 'img2' : 'img1';
                    const currId = currentImg === 1 ? 'img1' : 'img2';

                    const nextEl = document.getElementById(nextId);
                    const currEl = document.getElementById(currId);

                    const img = new Image();
                    img.src = data.url;
                    img.onload = () => {
                        nextEl.style.backgroundImage = `url('${data.url}')`;
                        nextEl.classList.add('active');
                        currEl.classList.remove('active');
                        currentImg = currentImg === 1 ? 2 : 1;
                    };
                }
            } catch (e) {
                console.error("Slideshow fetch error:", e);
            }
        }

        function nextImage() {
            if (!config.isRunning) return;
            // Fetch immediately
            fetchNextImage();
            // Reset Interval to prevent double skip
            if (slideshowTimer) clearInterval(slideshowTimer);
            slideshowTimer = setInterval(fetchNextImage, config.intervalMs);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- Image Flagging Logic ---
        function handleKeyboardShortcuts(e) {
            // 'R' or 'r' key mapped to retouch flag
            if (e.key === 'r' || e.key === 'R') {
                flagCurrentImg();
            }
        }

        async function flagCurrentImg() {
            if (!config.isRunning) return;

            if (!actualCurrentFilename || actualCurrentFilename === "") return;

            // Visual feedback on button
            const fb = document.getElementById('flagBtn');
            fb.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            lucide.createIcons();

            try {
                const res = await fetch('/api/flags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_name: actualCurrentFilename })
                });
                const data = await res.json();
                showNotification(data.message || "Megjelölve!");
            } catch (e) {
                showNotification("Hálózati hiba mentéskor!");
            } finally {
                fb.innerHTML = '<i data-lucide="wand-2" class="w-5 h-5"></i>';
                lucide.createIcons();
            }
        }

        function showNotification(msg) {
            const toast = document.getElementById('notificationToast');
            const textEl = document.getElementById('notificationText');
            textEl.textContent = msg;
            toast.classList.add('notification-visible');
            setTimeout(() => {
                toast.classList.remove('notification-visible');
            }, 3000);
        }

        // --- Custom Modal logic ---
        function showCustomModal({ title = "Közlendő", message = "", icon = "info", confirmText = "OK", cancelText = null, onConfirm = null }) {
            const modal = document.getElementById('customModal');
            const mTitle = document.getElementById('modalTitle');
            const mMessage = document.getElementById('modalMessage');
            const mButtons = document.getElementById('modalButtons');
            const mIcon = document.getElementById('modalIcon');
            const mContent = document.getElementById('modalContent');
            
            mTitle.innerText = title;
            mMessage.innerText = message;
            mIcon.setAttribute('data-lucide', icon);
            lucide.createIcons();
            
            mButtons.innerHTML = '';
            
            if (cancelText) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = "modal-btn modal-btn-secondary";
                cancelBtn.innerText = cancelText;
                cancelBtn.onclick = () => {
                    mContent.style.opacity = '0';
                    mContent.style.transform = 'scale(0.95)';
                    setTimeout(() => modal.classList.add('hidden'), 300);
                };
                mButtons.appendChild(cancelBtn);
            }
            
            const okBtn = document.createElement('button');
            okBtn.className = "modal-btn modal-btn-primary";
            okBtn.innerText = confirmText;
            okBtn.onclick = () => {
                mContent.style.opacity = '0';
                mContent.style.transform = 'scale(0.95)';
                setTimeout(() => modal.classList.add('hidden'), 300);
                if (onConfirm) onConfirm();
            };
            mButtons.appendChild(okBtn);
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                mContent.style.opacity = '1';
                mContent.style.transform = 'scale(1)';
            }, 10);
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.querySelector('.fs-btn');
            btn.style.opacity = document.fullscreenElement ? '0' : '0.2';
            btn.style.pointerEvents = document.fullscreenElement ? 'none' : 'auto';
        });

        // --- YouTube Audio Integration ---
        let ytPlayer = null;
        let isPlaying = false;

        async function initializeYouTubeMusic() {
            try {
                const res = await fetch('/music/config');
                const conf = await res.json();

                if (!conf.music_enabled || !conf.youtube_playlist_id) return;

                document.getElementById('musicControls').classList.remove('hidden');

                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

                window.onYouTubeIframeAPIReady = () => {
                    let playerConfig = {
                        height: '0', width: '0',
                        playerVars: {
                            'autoplay': 1, 'controls': 0, 'loop': 1, 'playsinline': 1,
                            'origin': window.location.origin
                        },
                        events: {
                            'onReady': (e) => {
                                e.target.setVolume(conf.volume || 50);
                                e.target.playVideo();
                            },
                            'onStateChange': (e) => {
                                isPlaying = (e.data === YT.PlayerState.PLAYING);
                                updatePlayPauseBtn();
                            }
                        }
                    };

                    if (conf.youtube_playlist_id.startsWith('PL')) {
                        playerConfig.playerVars.listType = 'playlist';
                        playerConfig.playerVars.list = conf.youtube_playlist_id;
                    } else {
                        playerConfig.videoId = conf.youtube_playlist_id;
                        playerConfig.playerVars.playlist = conf.youtube_playlist_id;
                    }

                    ytPlayer = new YT.Player('youtubePlayer', playerConfig);
                };
            } catch (e) {
                console.log("Music init failed:", e);
            }
        }

        function togglePlayback() {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function updatePlayPauseBtn() {
            const icon = document.querySelector('#playPauseBtn i');
            if (isPlaying) {
                icon.setAttribute('data-lucide', 'pause');
            } else {
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }
    </script>
</body>
